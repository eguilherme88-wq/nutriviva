<script src="./firebase-config.js"></script>
<script>
/* NutriViva · motor do atendimento automático pelo WhatsApp.
 * O mesmo arquivo roda no navegador (simulador do site) e no servidor Node (WhatsApp Cloud API).
 * await NVBot.reply(db, telefone, texto, {uid, now, hash, siteUrl}) altera o objeto db e devolve {replies, changed, chat}.
 * hash(senha) deve devolver o SHA-256 em hexadecimal (modo demonstração, login no navegador).
 * createAccount({phone, name, password}) cria o login no Firebase Authentication e devolve o id (modo Firebase).
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.NVBot = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const MAX_MESSAGES = 200, MAX_PROS = 9, MAX_DATES = 8, MAX_TIMES = 12, SESSION_MINUTES = 30;
  const DEFAULT_WELCOME = 'Olá! Eu sou o assistente virtual da NutriViva 🌿';
  const DEFAULT_OFF = 'Recebemos sua mensagem. Nossa equipe vai responder por aqui assim que possível.';

  const pad = n => String(n).padStart(2, '0');
  const when = s => new Date(s.date + 'T' + s.time + ':00');
  const money = n => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const dayLabel = d => new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' });
  const fmt = s => dayLabel(s.date) + ' às ' + s.time;
  const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[!?.,;]+$/g, '').trim();

  function normPhone(v) {
    let n = String(v || '').replace(/\D/g, '');
    if (n.length === 10 || n.length === 11) n = '55' + n;
    return /^[1-9]\d{7,14}$/.test(n) ? n : '';
  }
  function safeUrl(v) { try { const u = new URL(v); return u.protocol === 'https:' ? u.href : ''; } catch { return ''; } }
  const duration = (db, proId) => (db.users.find(u => u.id === proId)?.duration || 50);
  const prettyPhone = n => { const m = String(n).match(/^55(\d{2})(\d{4,5})(\d{4})$/); return m ? `(${m[1]}) ${m[2]}-${m[3]}` : '+' + n; };
  const findPatient = (db, phone) => db.users.find(u => u.role === 'paciente' && normPhone(u.phone) === phone) || null;
  const pros = db => db.users.filter(u => u.role === 'nutricionista');

  function freeSlots(db, proId, now) {
    return db.slots
      .filter(s => s.pro === proId && when(s) > now && !s.booking && !db.bookings.some(b => b.slot === s.id && b.status !== 'cancelada'))
      .sort((a, b) => when(a) - when(b));
  }
  // Consultas confirmadas que ainda não terminaram (inclui a que está acontecendo agora).
  function upcoming(db, patientId, now) {
    return db.bookings
      .filter(b => b.patient === patientId && b.status === 'confirmada')
      .map(b => ({ b, s: db.slots.find(s => s.id === b.slot) }))
      .filter(x => x.s && when(x.s).getTime() + duration(db, x.s.pro) * 60000 > now.getTime())
      .sort((x, y) => when(x.s) - when(y.s));
  }
  function overlaps(db, patientId, slot) {
    const start = when(slot).getTime(), end = start + duration(db, slot.pro) * 60000;
    return db.bookings.some(b => {
      if (b.patient !== patientId || b.status !== 'confirmada') return false;
      const x = db.slots.find(t => t.id === b.slot);
      if (!x) return false;
      const xs = when(x).getTime();
      return xs < end && xs + duration(db, x.pro) * 60000 > start;
    });
  }

  function menuText() {
    return ['Como posso ajudar? Responda com o *número*:', '',
      '*1* Agendar consulta', '*2* Minhas consultas', '*3* Cancelar consulta',
      '*4* Escolher nutricionista', '*5* Link da videochamada', '*6* Falar com um atendente', '',
      'A qualquer momento, envie *menu* para voltar aqui.'].join('\n');
  }
  function intent(t) {
    if (/^[1-6]$/.test(t)) return Number(t);
    if (/cancel|desmarc/.test(t)) return 3;
    if (/minhas|meus agend|minha consulta|proxima consulta/.test(t)) return 2;
    if (/link|sala|video|meet/.test(t)) return 5;
    if (/atendente|humano|pessoa|falar com/.test(t)) return 6;
    if (/agend|marcar|horario/.test(t)) return 1;
    if (/valor|preco|nutricionista|nutri|especialidade|quanto custa|escolher/.test(t)) return 4;
    return 0;
  }
  const GREETINGS = ['menu', 'inicio', 'oi', 'ola', 'oie', 'bom dia', 'boa tarde', 'boa noite', '0', 'voltar', 'comecar', 'robo'];
  const BYE = ['sair', 'encerrar', 'tchau', 'obrigado', 'obrigada', 'valeu'];
  const NOT_FOUND = 'Não encontrei um cadastro de paciente com este número de WhatsApp.\n\nSe você já tem conta no site, cadastre este número em *Minha conta*. Para agendar agora, envie *1*.';

  async function reply(db, phoneRaw, text, opts) {
    opts = opts || {};
    const now = opts.now ? opts.now() : new Date();
    const uid = opts.uid;
    const iso = now.toISOString();
    const phone = normPhone(phoneRaw);
    if (!phone) return { replies: [], changed: false, chat: null };
    db.users = db.users || []; db.slots = db.slots || []; db.bookings = db.bookings || [];
    db.waChats = Array.isArray(db.waChats) ? db.waChats : [];
    const cfg = db.whatsapp || {};
    const siteUrl = String(opts.siteUrl || cfg.siteUrl || '').trim();

    let chat = db.waChats.find(c => c.phone === phone);
    if (!chat) {
      chat = { id: uid(), phone, state: { step: 'menu' }, messages: [], handoff: false, created: iso, updated: iso };
      db.waChats.push(chat);
    }
    const firstContact = chat.messages.length === 0;
    const idle = (now - new Date(chat.updated)) / 60000 > SESSION_MINUTES;
    if (idle && !chat.handoff) chat.state = { step: 'menu' };

    const body = String(text || '').slice(0, 1000);
    // A senha digitada no cadastro nunca fica gravada no histórico da conversa.
    const secret = !chat.handoff && !idle && cfg.enabled !== false && chat.state?.step === 'askPassword';
    chat.messages.push({ from: 'user', text: secret ? '•••••••• (senha ocultada)' : body, at: iso });
    const out = [];
    const say = m => out.push(m);
    const t = norm(body);
    const patient = () => findPatient(db, phone);
    const state = chat.state || { step: 'menu' };
    const go = s => { chat.state = s; };
    const greeting = () => {
      const p = patient();
      return (cfg.welcome || DEFAULT_WELCOME) + (p ? `\n\nQue bom falar com você, *${p.name.split(' ')[0]}*.` : '') + '\n\n' + menuText();
    };
    const invalid = n => say(`Não entendi 🙂 Responda com um número de *1* a *${n}*, ou envie *menu*.`);
    const pick = list => { const n = Number(t); return Number.isInteger(n) && n >= 1 && n <= list.length ? list[n - 1] : null; };

    // Agradecimento final: só depois que o paciente usa a opção 5 (link) ou conclui a opção 3 (cancelar).
    function thanks(cancelled) {
      if (!chat.pendingThanks) return;
      chat.pendingThanks = false;
      const first = (patient()?.name || '').split(' ')[0];
      say(cancelled
        ? `Obrigado pelo contato${first ? ', *' + first + '*' : ''}! 💚 Quando quiser remarcar, é só enviar *1*. Estamos aqui para cuidar de você. 🌿`
        : `Muito obrigado por agendar com a NutriViva${first ? ', *' + first + '*' : ''}! 💚\nFicamos felizes em fazer parte do seu cuidado. Até a consulta! 🌿`);
    }
    function passwordPrompt() {
      return `Agora crie uma *senha* com pelo menos 8 caracteres.\n\nNo dia da consulta, você vai entrar na plataforma com *este celular* e essa senha para acessar a videochamada.`;
    }
    function startBooking() {
      const list = pros(db).map(p => ({ p, free: freeSlots(db, p.id, now) })).filter(x => x.free.length).slice(0, MAX_PROS);
      if (!list.length) { go({ step: 'menu' }); return say('No momento não há horários disponíveis. Envie *6* para falar com um atendente.'); }
      go({ step: 'pickPro', options: list.map(x => x.p.id) });
      say('Com quem você quer agendar?\n\n' + list.map((x, i) => `*${i + 1}* ${x.p.name} — ${x.p.specialty || 'Nutrição'} · ${money(x.p.price)}`).join('\n') + '\n\nResponda com o número.');
    }
    function listPros() {
      const list = pros(db).slice(0, MAX_PROS);
      if (!list.length) { go({ step: 'menu' }); return say('Ainda não há nutricionistas cadastrados.'); }
      go({ step: 'choosePro', options: list.map(p => p.id) });
      say('Qual nutricionista você quer conhecer?\n\n' + list.map((p, i) => {
        const next = freeSlots(db, p.id, now)[0];
        return `*${i + 1}* ${p.name}\n    ${p.specialty || 'Nutrição'} · ${money(p.price)}${next ? '' : ' · sem horários no momento'}`;
      }).join('\n') + '\n\nResponda com o número.');
    }
    function showPro(proId) {
      const p = db.users.find(u => u.id === proId && u.role === 'nutricionista');
      if (!p) return listPros();
      const free = freeSlots(db, p.id, now);
      const lines = [`🩺 *${p.name}*`, `${p.specialty || 'Nutrição'}${p.crn ? ' · ' + p.crn : ''}`];
      if (p.bio) lines.push('', p.bio);
      lines.push('', `💰 ${money(p.price)} · ⏱ ${p.duration || 50} min · 💻 On-line`);
      lines.push(free.length ? `📅 Próximo horário: ${fmt(free[0])}` : '📅 Sem horários disponíveis no momento');
      lines.push('', free.length ? `*1* Agendar com ${p.name.split(' ')[0]}` : '*1* Falar com um atendente', '*2* Ver outro nutricionista');
      go({ step: 'proAction', pro: p.id, hasSlots: free.length > 0 });
      say(lines.join('\n'));
    }
    function listDates(proId) {
      const p = db.users.find(u => u.id === proId);
      const dates = [...new Set(freeSlots(db, proId, now).map(s => s.date))].slice(0, MAX_DATES);
      if (!p || !dates.length) { startBooking(); return; }
      go({ step: 'pickDate', pro: proId, options: dates });
      say(`*${p.name}* · ${money(p.price)} · ${p.duration || 50} min\n\nEscolha o dia:\n\n` + dates.map((d, i) => `*${i + 1}* ${dayLabel(d)}`).join('\n'));
    }
    function listTimes(proId, date) {
      const slots = freeSlots(db, proId, now).filter(s => s.date === date).slice(0, MAX_TIMES);
      if (!slots.length) { say('Esse dia acabou de ficar sem horários.'); return listDates(proId); }
      go({ step: 'pickTime', pro: proId, date, options: slots.map(s => s.id) });
      say(`Horários em *${dayLabel(date)}*:\n\n` + slots.map((s, i) => `*${i + 1}* ${s.time}`).join('\n') + '\n\nHorário de Brasília.');
    }
    function askConfirm(slotId) {
      const s = db.slots.find(x => x.id === slotId), p = db.users.find(u => u.id === s?.pro), pat = patient();
      if (!s || !p || !pat) return startBooking();
      go({ step: 'confirm', slot: slotId, pro: p.id, date: s.date });
      say(`Confira sua consulta:\n\n👤 ${pat.name}\n🩺 ${p.name} — ${p.specialty || 'Nutrição'}\n📅 ${fmt(s)}\n⏱ ${p.duration || 50} min · ${money(p.price)}\n💻 On-line, por videochamada\n\n*1* Confirmar\n*2* Escolher outro horário`);
    }
    function listMine(forStep) {
      const p = patient();
      if (!p) { go({ step: 'menu' }); return say(NOT_FOUND); }
      const list = upcoming(db, p.id, now);
      if (!list.length) { go({ step: 'menu' }); return say('Você não tem consultas agendadas. Envie *1* para agendar.'); }
      const lines = list.map((x, i) => {
        const pro = db.users.find(u => u.id === x.s.pro);
        return `${forStep ? `*${i + 1}* ` : '• '}${fmt(x.s)} — ${pro?.name || 'Nutricionista'}`;
      });
      if (forStep) {
        go({ step: 'pickCancel', options: list.map(x => x.b.id) });
        return say('Qual consulta você quer cancelar?\n\n' + lines.join('\n'));
      }
      go({ step: 'menu' });
      say('Suas próximas consultas:\n\n' + lines.join('\n') + '\n\nEnvie *5* para o link da videochamada ou *3* para cancelar.');
    }
    function runOption(n) {
      if (n === 1) return startBooking();
      if (n === 2) return listMine(false);
      if (n === 3) return listMine(true);
      if (n === 4) return listPros();
      if (n === 5) {
        go({ step: 'menu' });
        const p = patient();
        if (!p) return say(NOT_FOUND);
        const list = upcoming(db, p.id, now);
        if (!list.length) return say('Você não tem consultas agendadas. Envie *1* para agendar.');
        say(list.map(x => {
          const pro = db.users.find(u => u.id === x.s.pro);
          const url = x.b.room ? safeUrl(x.b.room) : safeUrl(pro?.room);
          return `📅 ${fmt(x.s)} — ${pro?.name || ''}\n${url ? '🔗 ' + url : 'O link ainda não foi disponibilizado. Ele aparece aqui assim que o nutricionista salvar a sala.'}`;
        }).join('\n\n'));
        return thanks(false);
      }
      if (n === 6) {
        go({ step: 'menu' });
        chat.handoff = true; chat.handoffAt = iso;
        return say('Certo! Vou chamar um atendente da nossa equipe, que vai responder por aqui. 🙋\n\nSe quiser voltar ao atendimento automático, envie *menu*.');
      }
    }

    // 1. Robô desativado na configuração
    if (cfg.enabled === false) {
      if (!chat.handoff) { chat.handoff = true; chat.handoffAt = iso; say(cfg.offMessage || DEFAULT_OFF); }
    }
    // 2. Conversa com atendente humano: o robô só volta com "menu"
    else if (chat.handoff) {
      if (['menu', 'robo', 'voltar', 'inicio'].includes(t)) { chat.handoff = false; go({ step: 'menu' }); say(greeting()); }
    }
    // 3. Comandos globais
    else if (GREETINGS.includes(t)) { go({ step: 'menu' }); say(greeting()); }
    else if (BYE.includes(t)) { go({ step: 'menu' }); say('Até logo! Quando precisar, é só mandar *oi*. 🌿'); }
    // 4. Etapas da conversa
    else switch (state.step) {
      case 'pickPro': { const id = pick(state.options || []); id ? listDates(id) : invalid((state.options || []).length); break; }
      case 'choosePro': { const id = pick(state.options || []); id ? showPro(id) : invalid((state.options || []).length); break; }
      case 'proAction': {
        if (t === '2' || /outro|lista/.test(t)) { listPros(); break; }
        if (!(t === '1' || /agend|marcar|sim|atendente/.test(t))) { invalid(2); break; }
        if (freeSlots(db, state.pro, now).length) listDates(state.pro); else runOption(6);
        break;
      }
      case 'pickDate': { const d = pick(state.options || []); d ? listTimes(state.pro, d) : invalid((state.options || []).length); break; }
      case 'pickTime': {
        const id = pick(state.options || []);
        if (!id) { invalid((state.options || []).length); break; }
        if (!freeSlots(db, state.pro, now).some(s => s.id === id)) { say('Esse horário acabou de ser reservado.'); listTimes(state.pro, state.date); break; }
        const known = patient();
        if (known && (known.password || opts.createAccount)) askConfirm(id);
        else if (known) { go({ step: 'askPassword', slot: id, pro: state.pro, date: state.date, name: known.name }); say(passwordPrompt()); }
        else { go({ step: 'askName', slot: id, pro: state.pro, date: state.date }); say('Você ainda não tem cadastro. Vamos criar agora, leva menos de um minuto. 🙂\n\nQual é o seu *nome completo*?'); }
        break;
      }
      case 'askName': {
        const name = body.trim().replace(/\s+/g, ' ');
        if (name.length < 3 || name.length > 100 || !/\p{L}{2,}/u.test(name) || /^\d+$/.test(name)) { say('Por favor, envie seu nome completo (ou *menu* para voltar).'); break; }
        go({ ...state, step: 'askPassword', name });
        say(passwordPrompt());
        break;
      }
      case 'askPassword': {
        const pass = body.trim();
        if (pass.length < 8 || pass.length > 64) { say('A senha precisa ter de *8 a 64 caracteres*. Envie outra senha (ou *menu* para voltar).'); break; }
        let p = patient();
        try {
          if (typeof opts.createAccount === 'function') {
            const id = await opts.createAccount({ phone, name: state.name || p?.name, password: pass });
            if (!p) { p = { id, name: state.name, email: '', role: 'paciente', phone, origin: 'whatsapp', created: iso }; db.users.push(p); }
          } else if (typeof opts.hash === 'function') {
            const passwordHash = await opts.hash(pass);
            if (p) p.password = passwordHash;
            else { p = { id: uid(), name: state.name, email: '', password: passwordHash, role: 'paciente', phone, origin: 'whatsapp', created: iso }; db.users.push(p); }
          } else throw Error('sem método de cadastro');
        } catch (e) {
          go({ step: 'menu' });
          say('Não foi possível criar o seu cadastro agora. Tente novamente em alguns minutos ou envie *6* para falar com um atendente.');
          break;
        }
        say(`Cadastro pronto, *${p.name.split(' ')[0]}*! ✅\n\nPara entrar na plataforma no dia da consulta:\n📱 Login: *${prettyPhone(phone)}* (este celular)\n🔒 Senha: a que você acabou de criar${siteUrl ? '\n🌐 ' + siteUrl : ''}\n\nPor segurança, apague a mensagem com a senha desta conversa (toque e segure → Apagar).`);
        askConfirm(state.slot);
        break;
      }
      case 'confirm': {
        if (t === '2' || /outro|trocar|nao/.test(t)) { listTimes(state.pro, state.date); break; }
        if (!(t === '1' || /^(sim|confirm|ok|pode)/.test(t))) { invalid(2); break; }
        const s = db.slots.find(x => x.id === state.slot), p = patient();
        if (!s || !p || !freeSlots(db, s.pro, now).some(x => x.id === s.id)) { say('Esse horário não está mais disponível.'); listTimes(state.pro, state.date); break; }
        if (overlaps(db, p.id, s)) { go({ step: 'menu' }); say('Você já tem uma consulta nesse período. Envie *2* para ver suas consultas.'); break; }
        const bookingId = uid();
        db.bookings.push({ id: bookingId, slot: s.id, patient: p.id, pro: s.pro, status: 'confirmada', created: iso, origin: 'whatsapp' });
        s.booking = bookingId;
        go({ step: 'menu' });
        const pro = db.users.find(u => u.id === s.pro);
        say(`Consulta agendada! ✅\n\n📅 ${fmt(s)}\n🩺 ${pro?.name || ''}\n\nNo dia, entre na plataforma com seu celular e senha${siteUrl ? ' em ' + siteUrl : ''} e clique em *Entrar na sala*. Se preferir, envie *5* aqui para receber o link da videochamada. Para cancelar, envie *3*.`);
        chat.pendingThanks = true;
        break;
      }
      case 'pickCancel': {
        const id = pick(state.options || []);
        if (!id) { invalid((state.options || []).length); break; }
        const b = db.bookings.find(x => x.id === id), s = db.slots.find(x => x.id === b?.slot);
        go({ step: 'confirmCancel', booking: id });
        say(`Cancelar a consulta de *${s ? fmt(s) : ''}*?\n\n*1* Sim, cancelar\n*2* Não, manter`);
        break;
      }
      case 'confirmCancel': {
        if (t === '2' || /^nao|manter/.test(t)) { go({ step: 'menu' }); say('Tudo certo, sua consulta foi mantida. 👍'); thanks(false); break; }
        if (!(t === '1' || /^sim|cancel/.test(t))) { invalid(2); break; }
        const p = patient(), b = db.bookings.find(x => x.id === state.booking);
        go({ step: 'menu' });
        if (!p || !b || b.patient !== p.id || b.status !== 'confirmada') { say('Não foi possível cancelar essa consulta. Envie *6* para falar com um atendente.'); break; }
        b.status = 'cancelada'; b.cancelled = iso; b.cancelledBy = 'whatsapp';
        const freed = db.slots.find(x => x.id === b.slot);
        if (freed && freed.booking === b.id) freed.booking = null;
        say('Consulta cancelada. O horário voltou para a agenda do nutricionista. Se quiser remarcar, envie *1*.');
        thanks(true);
        break;
      }
      default: {
        const n = intent(t);
        if (n) runOption(n);
        else if (firstContact || idle) say(greeting());
        else say('Desculpe, não entendi. 🙂\n\n' + menuText());
      }
    }

    for (const m of out) chat.messages.push({ from: 'bot', text: m, at: iso });
    if (chat.messages.length > MAX_MESSAGES) chat.messages = chat.messages.slice(-MAX_MESSAGES);
    chat.updated = iso;
    return { replies: out, changed: true, chat };
  }

  return { reply, normPhone, menuText };
});
</script>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), uid=()=>crypto.randomUUID(), key='nutriviva-demo-v1';
const photos=['https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=700&q=85','https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=700&q=85','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=85'];
let db,user=null,tab='visao',special='Todos',selectedSlot=null,bookPro=null;
/* ===== Banco de dados na nuvem (Firebase: Authentication + Cloud Firestore) =====
 * Ativado quando firebase-config.js traz a configuração do projeto. Sem ela, o site continua no modo de demonstração (dados no navegador).
 * O restante do app continua usando o objeto "db": os ouvintes do Firestore preenchem db, e persist() grava só o que mudou. */
const FIREBASE_SDK='13.4.0',PATIENT_DOMAIN='paciente.nutriviva.app';
const CLOUD_COLS=['users','slots','bookings','ads','prescriptions','clinicalEntries','anamneses','patientLinks','waChats'];
const DEFAULT_MATRIX={administrador:{users:true,ads:true,professionals:true,appointments:true,matrix:false},usuario:{users:false,ads:false,professionals:false,appointments:true,matrix:false}};
const cloud={on:false,fb:null,app:null,auth:null,fs:null,subs:[],parts:{},base:{},authUser:null,roleFor:'',setupDone:true,editing:false,dirty:false,timer:0};
function cloudConfigured(){const c=window.NUTRIVIVA_FIREBASE;return !!(c&&typeof c==='object'&&c.apiKey&&c.projectId&&c.appId)}
function cloudOptions(){const {useEmulators,...o}=window.NUTRIVIVA_FIREBASE;return o}
function cloudEmulate(auth,fs){if(!window.NUTRIVIVA_FIREBASE.useEmulators)return;const fb=cloud.fb;fb.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});if(fs)fb.connectFirestoreEmulator(fs,'127.0.0.1',8080)}
function patientEmail(phone){return phone+'@'+PATIENT_DOMAIN}
function cloudClean(x){const o=JSON.parse(JSON.stringify(x||{}));delete o.id;delete o.password;return o}
function cloudJson(x){const sort=v=>Array.isArray(v)?v.map(sort):v&&typeof v==='object'?Object.keys(v).sort().reduce((o,k)=>(o[k]=sort(v[k]),o),{}):v;return JSON.stringify(sort(cloudClean(x)))}
function cloudMsg(e,what='celular ou e-mail'){const c=e?.code||'';return ({
 'auth/invalid-credential':`${what[0].toUpperCase()+what.slice(1)} ou senha incorretos.`,'auth/wrong-password':'Senha incorreta.','auth/user-not-found':`${what[0].toUpperCase()+what.slice(1)} sem cadastro.`,'auth/invalid-email':`Confira o ${what}.`,
 'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente de novo.','auth/network-request-failed':'Sem conexão com a internet. Verifique e tente de novo.',
 'auth/email-already-in-use':`Este ${what} já tem cadastro. Use “Entrar”.`,'auth/weak-password':'Senha fraca: use pelo menos 8 caracteres.',
 'auth/requires-recent-login':'Por segurança, saia e entre de novo antes de alterar a senha.','auth/operation-not-allowed':'O login por e-mail e senha não está ativado no Firebase (Authentication → Método de login).',
 'permission-denied':'Você não tem permissão para esta ação.','unavailable':'Sem conexão com o banco de dados. Tente de novo.'})[c]||(e?.message||'Não foi possível concluir. Tente de novo.')}
async function cloudInit(){
 const b=`https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`;
 const [a,au,f]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
 const fb=cloud.fb={...a,...au,...f};
 cloud.app=fb.initializeApp(cloudOptions());cloud.auth=fb.getAuth(cloud.app);cloud.fs=fb.getFirestore(cloud.app);cloudEmulate(cloud.auth,cloud.fs);cloud.on=true;
 db={users:[],slots:[],bookings:[],ads:[],prescriptions:[],clinicalEntries:[],anamneses:[],patientLinks:[],waChats:[],matrix:JSON.parse(JSON.stringify(DEFAULT_MATRIX)),whatsapp:{}};
 const c=n=>fb.collection(cloud.fs,n),L=(k,ref,col)=>cloudListen('base',k,ref,col);
 L('pros',fb.query(c('users'),fb.where('role','==','nutricionista')),'users');L('slots',c('slots'),'slots');L('ads',fb.query(c('ads'),fb.where('active','==',true)),'ads');
 for(const d of ['matrix','whatsapp','setup'])L('cfg-'+d,fb.doc(cloud.fs,'config',d),'config');
 fb.onAuthStateChanged(cloud.auth,au=>{cloud.authUser=au;cloudUnsub('role');cloudUnsub('me');cloud.roleFor='';user=null;if(au)cloudListen('me','me',fb.doc(cloud.fs,'users',au.uid),'users');cloudScheduleRender()});
 await cloud.auth.authStateReady();if(cloud.auth.currentUser)await cloudWaitUser(6000);
 await new Promise(r=>setTimeout(r,50));
 const banner=$('.demo');if(banner)banner.textContent='VERSÃO DE TESTES · Dados salvos na nuvem (Firebase) · Use cadastros fictícios até concluir a revisão de segurança e LGPD';
 $('#modal').addEventListener('close',()=>{if(cloud.dirty)cloudScheduleRender()});
 document.addEventListener('input',e=>{if($('#app')?.contains(e.target))cloud.editing=true});
}
function cloudListen(group,key,ref,col){const fb=cloud.fb,isDoc=ref.type==='document';const store=m=>{(cloud.parts[col]||(cloud.parts[col]={}))[key]=m;cloudRecompute(col);if(key==='me')cloudMe();cloudScheduleRender()};
 const unsub=fb.onSnapshot(ref,snap=>{const m=new Map();if(isDoc){if(snap.exists())m.set(snap.id,{...snap.data(),id:snap.id})}else snap.forEach(d=>m.set(d.id,{...d.data(),id:d.id}));store(m)},err=>{console.warn('NutriViva · leitura não permitida ou indisponível:',key,err.code);store(new Map())});
 cloud.subs.push({group,key,col,unsub})}
function cloudUnsub(group){cloud.subs=cloud.subs.filter(s=>{if(s.group!==group)return true;s.unsub();if(cloud.parts[s.col])delete cloud.parts[s.col][s.key];cloudRecompute(s.col);return false})}
function cloudRecompute(col){const union=new Map();for(const part of Object.values(cloud.parts[col]||{}))for(const [id,d] of part)union.set(id,d);
 if(col==='config'){cloud.base.config=new Map();for(const k of ['matrix','whatsapp']){const target=db[k]||(db[k]={});for(const x of Object.keys(target))delete target[x];Object.assign(target,union.has(k)?cloudClean(union.get(k)):k==='matrix'?JSON.parse(JSON.stringify(DEFAULT_MATRIX)):{});for(const r of ['administrador','usuario'])if(k==='matrix'&&!target[r])target[r]={};cloud.base.config.set(k,cloudJson(target))}cloud.setupDone=union.has('setup')||!cloud.parts.config?.['cfg-setup'];return}
 const old=new Map((db[col]||[]).map(x=>[x.id,x])),arr=[];
 for(const [id,d] of union){const o=old.get(id);if(o){for(const k of Object.keys(o))delete o[k];Object.assign(o,d);arr.push(o)}else arr.push({...d})}
 db[col]=arr;cloud.base[col]=new Map(arr.map(x=>[x.id,cloudJson(x)]));
 if(col==='users')user=cloud.authUser?db.users.find(u=>u.id===cloud.authUser.uid)||null:null}
function cloudMe(){if(!user||cloud.roleFor===user.id+':'+user.role)return;cloudUnsub('role');cloud.roleFor=user.id+':'+user.role;const fb=cloud.fb,c=n=>fb.collection(cloud.fs,n),w=fb.where,q=fb.query,L=(k,ref,col)=>cloudListen('role',k,ref,col);
 if(user.role==='paciente'){L('myBookings',q(c('bookings'),w('patient','==',user.id)),'bookings');L('myRx',q(c('prescriptions'),w('patient','==',user.id),w('status','==','disponivel')),'prescriptions')}
 else if(user.role==='nutricionista'){L('proBookings',q(c('bookings'),w('pro','==',user.id)),'bookings');for(const col of ['prescriptions','clinicalEntries','anamneses','patientLinks'])L('pro-'+col,q(c(col),w('pro','==',user.id)),col);L('patients',q(c('users'),w('role','==','paciente')),'users')}
 else{L('allUsers',c('users'),'users');L('allBookings',c('bookings'),'bookings');L('allAds',c('ads'),'ads');L('waChats',c('waChats'),'waChats')}}
function cloudWaitUser(ms=8000){return new Promise(res=>{const t0=Date.now(),tick=()=>{if(user&&cloud.authUser&&user.id===cloud.authUser.uid)return res(user);if(Date.now()-t0>ms)return res(null);setTimeout(tick,100)};tick()})}
function cloudScheduleRender(){if(!cloud.on)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>{if($('#modal').open||cloud.editing){cloud.dirty=true;return}cloud.dirty=false;const y=scrollY;render();scrollTo(0,y)},120)}
function cloudPersist(){try{const fb=cloud.fb,batch=fb.writeBatch(cloud.fs);let n=0;
 for(const col of CLOUD_COLS){const base=cloud.base[col]||(cloud.base[col]=new Map()),cur=new Map((db[col]||[]).map(x=>[x.id,x]));
  for(const [id,x] of cur){if(!id)continue;const j=cloudJson(x);if(base.get(id)!==j){batch.set(fb.doc(cloud.fs,col,id),cloudClean(x));base.set(id,j);n++}}
  for(const id of [...base.keys()])if(!cur.has(id)){batch.delete(fb.doc(cloud.fs,col,id));base.delete(id);n++}}
 const cb=cloud.base.config||(cloud.base.config=new Map());for(const k of ['matrix','whatsapp']){const j=cloudJson(db[k]);if(cb.get(k)!==j){batch.set(fb.doc(cloud.fs,'config',k),cloudClean(db[k]));cb.set(k,j);n++}}
 if(n)batch.commit().catch(e=>{console.error(e);toast('Não foi salvo: '+cloudMsg(e))});return true}catch(e){console.error(e);toast('Não foi salvo: '+cloudMsg(e));return false}}
async function cloudLoginSubmit(f,management,form){const err=$('#err'),btn=form.querySelector('button.wide');err.textContent='';btn.disabled=true;
 try{const id=String(f.get('email')||'').trim(),byEmail=id.includes('@'),phone=byEmail?'':rxPhone(id);
  if(!byEmail&&!phone)throw Error('Informe o celular com DDD, por exemplo (47) 99999-9999.');
  if(management&&!byEmail)throw Error('A equipe entra com o e-mail.');
  await cloud.fb.signInWithEmailAndPassword(cloud.auth,byEmail?id.toLowerCase():patientEmail(phone),String(f.get('password')||''));
  const u=await cloudWaitUser();
  if(!u){await cloud.fb.signOut(cloud.auth);throw Error('Login encontrado, mas sem cadastro na plataforma. Fale com a clínica.')}
  if(management&&!['master','administrador','usuario'].includes(u.role)){await cloud.fb.signOut(cloud.auth);throw Error('Este acesso é exclusivo da equipe.')}

 catch(e){err.textContent=cloudMsg(e,management?'e-mail':'celular ou e-mail')}finally{if(btn.isConnected)btn.disabled=false}}
async function cloudRegister(f,role,email,form){const err=$('#err'),btn=form.querySelector('button.wide');err.textContent='';
 const name=String(f.get('name')||'').trim();if(!name){err.textContent='Informe seu nome.';return}
 let phone='';if(role==='paciente'){phone=rxPhone(String(f.get('phone')||''));if(!phone){err.textContent='Informe o celular com DDD, por exemplo (47) 99999-9999.';return}}
 const u={name,email,role,created:new Date().toISOString()};if(phone)u.phone=phone;
 if(role==='nutricionista')Object.assign(u,{crn:String(f.get('crn')||''),specialty:String(f.get('specialty')||''),price:Number(f.get('price')),duration:50,bio:'',photo:'',room:''});
 btn.disabled=true;
 try{const cred=await cloud.fb.createUserWithEmailAndPassword(cloud.auth,role==='paciente'?patientEmail(phone):email,String(f.get('password')||''));
  await cloud.fb.setDoc(cloud.fb.doc(cloud.fs,'users',cred.user.uid),u);await cloudWaitUser();

 catch(e){err.textContent=cloudMsg(e,role==='paciente'?'celular':'e-mail')}finally{if(btn.isConnected)btn.disabled=false}}
async function cloudSaveAccount(ownerId,fields){if(!user||user.id!==ownerId)throw Error('Entre novamente para alterar a conta.');
 const name=String(fields.name||'').trim();if(!name||name.length>100)throw Error('Informe um nome válido.');
 const next=String(fields.nextPassword||'');if(next&&next.length<8)throw Error('A nova senha deve ter pelo menos 8 caracteres.');
 if(next){const cu=cloud.auth.currentUser;if(!fields.currentPassword)throw Error('Informe a senha atual para trocar a senha.');

async function cloudAddStaff(f,email){const role=f.get('role');if(role==='administrador'&&user.role!=='master')return;const fb=cloud.fb,err=$('#err');let sec;
 try{sec=fb.initializeApp(cloudOptions(),'equipe-'+Date.now());const sa=fb.getAuth(sec);cloudEmulate(sa);
  const cred=await fb.createUserWithEmailAndPassword(sa,email,String(f.get('password')||''));await fb.signOut(sa);
  db.users.push({id:cred.user.uid,name:String(f.get('name')||'').trim(),email,role,created:new Date().toISOString()});persist();closeModal();dashboard();toast('Acesso cadastrado.')}
 catch(e){err.textContent=cloudMsg(e,'e-mail')}finally{if(sec)fb.deleteApp(sec).catch(()=>{})}}
function exportLocalPage(){let raw=null,data=null;try{raw=localStorage.getItem(key);data=raw?JSON.parse(raw):null}catch{}
 const n=k=>Array.isArray(data?.[k])?data[k].length:0,demo=u=>/@nutriviva\.demo$/.test(u.email||'');
 const real=(data?.users||[]).filter(u=>!demo(u));
 $('#app').innerHTML=`<div class="page"><div class="panel" style="max-width:640px;margin:30px auto"><div class="eyebrow">Dados da versão de demonstração</div><h2>Exportar dados deste aparelho</h2>${data?`<p class="subtle">Este navegador guarda dados da versão anterior do NutriViva (antes do banco na nuvem). Baixe o arquivo para que eles possam ser importados no Firebase.</p><div class="stats" style="margin:20px 0"><div class="stat"><span>Cadastros</span><strong>${n('users')}</strong><span>${real.length} fora dos perfis de demonstração</span></div><div class="stat"><span>Consultas</span><strong>${n('bookings')}</strong></div><div class="stat"><span>Horários</span><strong>${n('slots')}</strong></div></div><p class="subtle" style="font-size:12px">Também: ${n('prescriptions')} receituário(s), ${n('clinicalEntries')} registro(s) de prontuário, ${n('anamneses')} anamnese(s), ${n('ads')} anúncio(s), ${n('waChats')} conversa(s) de WhatsApp.</p>${real.length?`<p class="subtle" style="font-size:12px"><b>Cadastros:</b> ${real.slice(0,30).map(u=>esc(u.name)+' ('+esc(u.role)+')').join(', ')}${real.length>30?'…':''}</p>`:''}<button class="btn wide" id="exportLocal">Baixar arquivo nutriviva-dados.json ↓</button><p class="note">O arquivo contém cadastros e dados de saúde. Envie apenas para quem vai fazer a importação e apague depois. Nada é apagado deste aparelho.</p>`:`<p class="note">Não há dados da versão de demonstração neste navegador. Abra esta mesma página no navegador ou no app instalado em que os cadastros foram feitos.</p>`}<a class="btn light small" href="#inicio">Voltar à página inicial</a></div></div>`;
 if(data)$('#exportLocal').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='nutriviva-dados.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Arquivo baixado.')}}
let importData=null;
function importPage(){const box=c=>`<div class="page"><div class="panel" style="max-width:720px;margin:30px auto"><div class="eyebrow">Versão anterior</div><h2>Importar dados</h2>${c}<p style="margin-top:20px"><a class="btn light small" href="#painel">Ir para o meu painel</a></p></div></div>`;

function importOptions(){const d=importData,area=$('#importArea');
 if(user.role==='nutricionista'){const demo=u=>/@nutriviva\.demo$/.test(u.email||'');const pros=d.users.filter(u=>u.role==='nutricionista').sort((a,b)=>demo(a)-demo(b)||(b.email===user.email)-(a.email===user.email));

  const show=()=>{const p=pros.find(x=>x.id===$('#importPro').value);$('#importPreview').innerHTML=`<div class="introbar" style="margin:14px 0"><img class="profilepic" src="${esc(imageUrl(p.photo)||photos[1])}" alt=""><div><b>${esc(p.name)}</b><p class="subtle" style="font-size:12px;margin:4px 0">${esc(p.crn||'')} · ${money(p.price||0)} · ${esc(p.bio||'')}</p></div></div>`;const n=fut(p.id);$('#importSlotsLabel').textContent=n?`${n} horário(s) futuro(s) da agenda`:'Horários futuros (nenhum: os horários do arquivo já passaram)';$('#importSlots').disabled=!n;$('#importSlots').checked=!!n};
  $('#importPro').onchange=show;show();
  $('#importGo').onclick=async()=>{const p=pros.find(x=>x.id===$('#importPro').value),btn=$('#importGo');btn.disabled=true;try{let msg=[];
   if($('#importProfile').checked){const photo=imageUrl(p.photo)?await shrinkImage(p.photo,900):user.photo||'';Object.assign(user,{name:String(p.name||user.name).slice(0,100),crn:String(p.crn||''),specialty:String(p.specialty||''),bio:String(p.bio||'').slice(0,300),price:Number(p.price)||0,duration:Number(p.duration)||50,room:safeUrl(p.room||'')||'',photo});msg.push('perfil')}
   if($('#importSlots').checked){let n=0;for(const s of (d.slots||[]).filter(s=>s.pro===p.id&&future(s)))if(!db.slots.some(x=>x.pro===user.id&&x.date===s.date&&x.time===s.time)){db.slots.push({id:uid(),pro:user.id,date:s.date,time:s.time});n++}msg.push(n+' horário(s)')}
   if(!msg.length){$('#importErr').textContent='Marque o que deseja importar.';return}

 if(!adCanManage()){area.innerHTML='<p class="note">Sua conta não tem permissão para gerenciar publicidade.</p>';return}

 $('#importGo').onclick=async()=>{const btn=$('#importGo'),sel=[...document.querySelectorAll('.importAd:checked')].map(x=>ads[+x.value]);if(!sel.length){$('#importErr').textContent='Selecione pelo menos um anúncio.';return}btn.disabled=true;
  try{for(const a of sel){const img=imageUrl(a.image)?await shrinkImage(a.image,1200):'';db.ads.push({id:uid(),title:String(a.title||'').slice(0,100),text:String(a.text||'').slice(0,300),advertiser:String(a.advertiser||''),url:safeUrl(a.url||'')||'',button:String(a.button||'Saiba mais').slice(0,35),active:a.active!==false,image:img,size:adSize(a),position:adPosition(a),fit:a.fit==='cover'?'cover':'contain'})}
   if(!persist())throw Error('não salvo');toast(sel.length+' anúncio(s) importado(s).');tab='publicidade';location.hash='painel'}catch(e){$('#importErr').textContent='Não foi possível importar: '+cloudMsg(e)}finally{if(btn.isConnected)btn.disabled=false}}}
function cloudSetupPage(){$('#app').innerHTML=`<div class="page"><div class="panel" style="max-width:600px;margin:30px auto"><div class="eyebrow">Primeiro acesso</div><h2>Criar a conta master</h2><p class="subtle">O banco de dados está vazio. Crie a conta do gestor da clínica. Ela terá acesso completo e poderá cadastrar a equipe. Esta tela só aparece uma vez.</p><form id="setupForm"><label for="setupName">Nome</label><input id="setupName" name="name" required maxlength="100" autocomplete="name"><label for="setupEmail">E-mail (login)</label><input id="setupEmail" name="email" type="email" required autocomplete="username"><label for="setupPass">Senha (mínimo 8 caracteres)</label><input id="setupPass" name="password" type="password" minlength="8" required autocomplete="new-password"><label for="setupPass2">Repita a senha</label><input id="setupPass2" name="password2" type="password" minlength="8" required autocomplete="new-password"><div class="error" id="err" role="alert"></div><button class="btn wide">Criar conta master ↗</button></form></div></div>`;
 $('#setupForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),err=$('#err'),btn=e.target.querySelector('button');const name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim().toLowerCase(),pw=String(f.get('password')||'');
  if(pw!==f.get('password2')){err.textContent='As senhas não conferem.';return}btn.disabled=true;
  try{const fb=cloud.fb,cred=await fb.createUserWithEmailAndPassword(cloud.auth,email,pw),uid=cred.user.uid,now=new Date().toISOString(),b=fb.writeBatch(cloud.fs);
   b.set(fb.doc(cloud.fs,'users',uid),{name,email,role:'master',created:now});b.set(fb.doc(cloud.fs,'config','setup'),{master:uid,at:now});
   b.set(fb.doc(cloud.fs,'config','matrix'),DEFAULT_MATRIX);b.set(fb.doc(cloud.fs,'config','whatsapp'),{enabled:true,number:'',welcome:'',offMessage:''});
   await b.commit();await cloudWaitUser();tab='visao';location.hash='painel';render();toast('Conta master criada. Bem-vindo!')}
  catch(e){err.textContent=cloudMsg(e,'e-mail')}finally{if(btn.isConnected)btn.disabled=false}}}

const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const when=s=>new Date(s.date+'T'+s.time+':00');
const future=s=>when(s)>new Date();
const fmt=s=>when(s).toLocaleString('pt-BR',{day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'});
async function hash(p){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))).map(b=>b.toString(16).padStart(2,'0')).join('')}
function persist(){if(cloud.on)return cloudPersist();try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){toast('Não foi possível salvar. Reduza o tamanho das fotos ou libere espaço.');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.tid);window.tid=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
function modal(t,b){$('#mtitle').textContent=t;$('#mbody').innerHTML=b;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:''}catch{return ''}}
function imageUrl(v){return /^data:image\/(png|jpeg|webp);base64,/.test(v||'')?v:safeUrl(v)}
function photo(p){return imageUrl(p.photo)||photos[1]}
function can(k){return user&&(['master'].includes(user.role)||db.matrix[user.role]?.[k])}
function admin(){return user&&['master','administrador','usuario'].includes(user.role)}
function slotsFor(id){return db.slots.filter(s=>s.pro===id&&future(s)&&!s.booking&&!db.bookings.some(b=>b.slot===s.id&&b.status!=='cancelada')).sort((a,b)=>when(a)-when(b))}

paciente');if(demoPatient&&!demoPatient.phone&&!db.users.some(u=>rxPhone(u.phone||'')==='5547999990000')){demoPatient.phone='5547999990000';persist()}const sid=sessionStorage.getItem('nv-session');user=db.users.find(u=>u.id===sid)||null;$('#year').textContent=new Date().getFullYear();waMount();render()}

(f.get('phone')||''));if(!phone){$('#err').textContent='Informe o celular com DDD, por exemplo (47) 99999-9999.';return}if(db.users.some(x=>x.role==='paciente'&&rxPhone(x.phone||'')===phone)){$('#err').textContent='Este celular já tem cadastro. Use “Entrar” com o celular e a senha.';return}u.phone=phone}if(role==='nutricionista')Object.assign(u,{crn:f.get('crn'),specialty:f.get('specialty'),price:Number(f.get('price')),duration:50,bio:'',photo:'',room:''});db.users.push(u);if(!persist()){db.users.pop();return}user=u;sessionStorage.setItem('nv-session',u.id);tab=role==='nutricionista'?'perfil':'visao';closeModal();location.hash='painel';render();toast('Cadastro realizado!')}}

function appointmentRow(b){const s=db.slots.find(s=>s.id===b.slot);if(!s)return '';const p=db.users.find(u=>u.id===s.pro),pat=db.users.find(u=>u.id===b.patient);return `<div class="listitem"><div><span class="badge">${esc(b.status)}</span>${b.origin==='whatsapp'?' <span class="badge free">via WhatsApp</span>':''}<p><b style="color:var(--text)">${fmt(s)}</b></p><p>Nutricionista: ${esc(p?.name)}<br>Paciente: ${esc(pat?.name)}</p></div><div class="row">${user.role==='nutricionista'&&user.id===s.pro?`<button class="btn small light" onclick="historyOpen('${b.patient}')">Histórico do paciente</button>`:''}${user.role==='nutricionista'&&user.id===s.pro&&b.status!=='cancelada'?`<button class="btn small light" onclick="rxForm('', '${b.patient}')">Criar receituário</button>`:''}${b.status==='confirmada'&&(user.id===s.pro||user.id===b.patient)?`<button class="btn small" onclick="enterRoom('${b.id}')">Entrar na sala ↗</button>`:''}${b.status==='confirmada'?`<button class="btn small danger" onclick="cancelBooking('${b.id}')">Cancelar</button>${(user.id===s.pro||admin())&&when(s)<=new Date()?`<button class="btn small light" onclick="completeBooking('${b.id}')">Concluir</button>`:''}`:''}</div></div>`}

function meetUrl(value){try{const u=new URL(value.trim());if(u.protocol!=='https:'||u.hostname!=='meet.google.com'||u.port||u.username||u.password||!/^\/[a-z]{3}-[a-z]{4}-[a-z]{3}\/?$/.test(u.pathname))return '';return u.origin+u.pathname.replace(/\/$/,'')}catch{return ''}}

12px" onclick="clearConsultationMeet('${b.id}')">Remover link desta consulta</button>`:''}`:''}<p class="note">Teste sem banco de dados: o link é salvo apenas neste navegador. Para testar os dois perfis, salve como nutricionista e entre como paciente no mesmo navegador. Em outro aparelho, compartilhe o link manualmente. A videochamada abre em uma nova aba.</p>`);if(isPro)$('#consultationMeetForm').onsubmit=e=>{e.preventDefault();saveConsultationMeet(id,$('#consultationMeetLink').value)};if(url)$('#copyRoomLink').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Link copiado.')}catch{$('#savedRoomLink').focus();$('#savedRoomLink').select();toast('Selecione e copie o link no campo acima.')}}}
function clearConsultationMeet(id){const b=db.bookings.find(b=>b.id===id),s=db.slots.find(s=>s.id===b?.slot);if(!b||s?.pro!==user?.id||b.status!=='confirmada')return;const old=b.room;delete b.room;if(!persist()){b.room=old;return}closeModal();dashboard();enterRoom(id);toast('Link específico removido.')}

function renderAgenda(){$('#dashContent').innerHTML=`<div class="panel"><div class="between"><h3>Disponibilize seus horários</h3><button class="btn light small" onclick="changeTab('calendario')">Ver calendário</button></div><p class="subtle" style="font-size:12px">Adicione horários individuais ou um intervalo. Consultas duram ${user.duration||50} minutos. Horário local do navegador.</p><form id="slotForm"><div class="grid2"><div><label>Data</label><input name="date" type="date" min="${localDate()}" required></div><div><label>Início</label><input name="start" type="time" required></div><div><label>Último horário de início (opcional)</label><input name="end" type="time"></div><div><label>Intervalo entre inícios (minutos)</label><input name="interval" type="number" min="${user.duration||50}" max="480" value="60" required></div></div><button class="btn wide">Adicionar à agenda</button><div id="sloterr" class="error"></div></form></div><div class="panel"><h3>Meus horários</h3><div id="slotList"></div></div>`;slotList();$('#slotForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),date=f.get('date'),start=f.get('start'),end=f.get('end')||start,interval=Number(f.get('interval'));const minutes=t=>Number(t.split(':')[0])*60+Number(t.split(':')[1]);if(end<start||interval<(user.duration||50)){$('#sloterr').textContent='Verifique o intervalo e o horário final.';return}let added=0;for(let m=minutes(start);m<=minutes(end);m+=interval){const time=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');const s={id:uid(),pro:user.id,date,time};if(future(s)&&!db.slots.some(x=>x.pro===user.id&&x.date===date&&Math.abs(minutes(x.time)-m)<(user.duration||50))){db.slots.push(s);added++}}persist();slotList();toast(added?`${added} horário(s) disponibilizado(s).`:'Nenhum horário adicionado. Confira datas futuras e sobreposições.')}}
function slotList(){const list=db.slots.filter(s=>s.pro===user.id&&future(s)).sort((a,b)=>when(a)-when(b));$('#slotList').innerHTML=list.map(s=>{const booked=db.bookings.some(b=>b.slot===s.id&&b.status!=='cancelada');return `<div class="listitem"><div><b>${fmt(s)}</b> <span class="badge">${booked?'Reservado':'Livre'}</span></div>${!booked?`<button class="btn small danger" onclick="removeSlot('${s.id}')">Remover horário</button>`:''}</div>`}).join('')||'<div class="empty">Nenhum horário futuro. Disponibilize sua agenda acima.</div>'}
function removeSlot(id){const s=db.slots.find(s=>s.id===id);if(s?.pro!==user.id||db.bookings.some(b=>b.slot===id&&b.status!=='cancelada'))return;db.slots=db.slots.filter(s=>s.id!==id);persist();slotList()}
async function readImage(file){if(!file||!file.size)return null;if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use uma imagem PNG, JPG ou WebP.');if(file.size>=1000000)throw Error('Use uma imagem com menos de 1 MB (1.000.000 bytes).');const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Não foi possível ler a imagem.'));r.readAsDataURL(file)});return await shrinkImage(raw)}
async function shrinkImage(src,max=1000){try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);let q=.85,out=c.toDataURL('image/jpeg',q);while(out.length>450000&&q>.4){q-=.15;out=c.toDataURL('image/jpeg',q)}return out.length<src.length||src.length>450000?out:src}catch{return src}}
function renderProfile(){$('#dashContent').innerHTML=`<div class="panel"><div class="between"><h3>Meu perfil e sala de atendimento</h3>${pwaButton()}<button class="btn light small" onclick="historyPatient='';changeTab('pacientes')">Histórico dos pacientes</button></div><p class="subtle" style="font-size:12px">Sua foto e suas informações aparecem na página inicial. O link da sala é mostrado somente nas consultas.</p><form id="profileForm"><div class="introbar"><img class="profilepic" src="${esc(photo(user))}" alt=""><b>${esc(user.name)}</b></div><label>Foto do nutricionista · da cintura para cima · menos de 1 MB</label><input name="photo" type="file" accept="image/png,image/jpeg,image/webp"><p class="subtle" style="font-size:11px">Envie uma foto vertical que mostre da cabeça até a cintura. A página inicial exibirá a imagem completa, sem cortar o tronco.</p><div class="grid2"><div><label>Nome público</label><input name="name" value="${esc(user.name)}" required maxlength="100"></div><div><label>Registro CRN</label><input name="crn" value="${esc(user.crn)}" required maxlength="40"></div><div><label>Especialidade</label><input name="specialty" value="${esc(user.specialty)}" required maxlength="80"></div><div><label>Valor da consulta (R$)</label><input name="price" type="number" min="0" step="0.01" value="${Number(user.price)}" required></div></div><label>Apresentação</label><textarea name="bio" maxlength="300">${esc(user.bio)}</textarea><label>Duração da consulta</label><input value="${user.duration||50} minutos" disabled><label>Link HTTPS da sala padrão de videochamada (opcional)</label><input name="room" type="url" placeholder="https://meet.google.com/..." value="${esc(user.room)}"><p style="margin-top:12px"><a href="https://meet.new/" target="_blank" rel="noopener noreferrer" class="btn light small">Criar sala no Google Meet ↗</a></p><p class="note">Copie o link criado no Google e cole no campo acima. Para uma sala por consulta, acesse “Consultas e sala”, abra a consulta e salve o link específico. Use admissão de participantes no Meet.</p><div id="err" class="error"></div><button class="btn wide">Salvar meu perfil</button></form></div>`;$('#profileForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('room')&&!safeUrl(f.get('room'))){$('#err').textContent='Informe um link HTTPS válido.';return}try{const img=await readImage(f.get('photo'));const old={...user};Object.assign(user,{name:f.get('name').trim(),crn:f.get('crn'),specialty:f.get('specialty'),bio:f.get('bio'),price:Number(f.get('price')),room:f.get('room')});if(img)user.photo=img;if(!persist()){Object.assign(user,old);return}toast('Perfil atualizado na página inicial.');dashboard()}catch(e){$('#err').textContent=e.message}}}
function panelThemeContext(){return !!user&&['painel','gestao'].includes(location.hash.slice(1))}

function syncPanelTheme(){const dark=panelThemeContext()&&userTheme()==='dark';document.documentElement.dataset.theme=dark?'dark':'light';const meta=$('meta[name="theme-color"]');if(meta)meta.setAttribute('content',dark?'#14231f':'#285c4c');document.querySelectorAll('[data-theme-toggle]').forEach(b=>{b.innerHTML=dark?'☀ <span class="theme-toggle-text">Tema claro</span>':'☾ <span class="theme-toggle-text">Tema escuro</span>';b.setAttribute('aria-label',dark?'Mudar para tema claro':'Mudar para tema escuro');b.setAttribute('aria-pressed',String(dark))});document.querySelectorAll('[data-theme-choice]').forEach(b=>{const active=b.dataset.themeChoice===(dark?'dark':'light');b.classList.toggle('selected-theme',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-theme-label]').forEach(e=>e.textContent=dark?'Tema escuro no seu painel':'Tema claro no seu painel')}
function setPanelTheme(theme){if(!user||!panelThemeContext()||!['light','dark'].includes(theme))return;try{localStorage.setItem('nutriviva-theme:'+user.id,theme)}catch{toast('Não foi possível salvar a preferência de tema.');return}syncPanelTheme()}

function renderAccount(){const canChangeEmail=user.role==='nutricionista'&&!cloud.on;$('#dashContent').innerHTML=`<div class="panel"><div class="between"><h3>Minha conta</h3>${pwaAllowed()?pwaButton():''}</div><form id="accountForm"><label for="accountName">Nome</label><input id="accountName" name="name" value="${esc(user.name)}" required maxlength="100">${user.role==='paciente'?`<label for="accountPhone">Celular com WhatsApp · seu login</label><input id="accountPhone" name="phone" type="tel" required maxlength="30" ${cloud.on?'readonly ':''}value="${esc(user.phone||'')}" placeholder="(47) 99999-9999" autocomplete="tel"><p class="subtle" style="font-size:11px">Você entra na plataforma com este celular e agenda, consulta e cancela pelo WhatsApp. ${cloud.on?'Para trocar o celular de login, fale com a clínica.':'Para trocar o número, informe também sua senha atual.'}</p>`:''}<label for="accountEmail">E-mail de acesso</label><input id="accountEmail" name="email" type="email" maxlength="254" value="${esc(user.email)}" ${canChangeEmail?'required autocomplete="email"':'disabled'}>${canChangeEmail?`<label for="accountConfirmEmail">Confirmar novo e-mail (preencha somente se alterar)</label><input id="accountConfirmEmail" name="confirmEmail" type="email" maxlength="254" autocomplete="off"><p class="note">Para alterar o e-mail, repita o novo endereço e informe sua senha atual. No próximo acesso, use o novo e-mail. Nesta demonstração, a alteração é local e não envia mensagem de confirmação.</p>`:''}<label for="accountOldPassword">Senha atual ${canChangeEmail?'(para alterar e-mail ou senha)':user.role==='paciente'?'(para alterar celular ou senha)':'(para alterar a senha)'}</label><input id="accountOldPassword" name="old" type="password" autocomplete="current-password"><label for="accountNewPassword">Nova senha (opcional, mínimo 8 caracteres)</label><input id="accountNewPassword" name="next" type="password" minlength="8" autocomplete="new-password"><div id="accountError" class="error" role="alert"></div><button class="btn wide" id="accountSave">Salvar alterações</button></form></div><div class="panel"><h3>Aparência do meu painel</h3><p class="subtle" style="font-size:13px">Escolha o tema para sua conta neste navegador. A página inicial permanece sempre clara.</p><div class="row"><button type="button" class="btn light" data-theme-choice="light" onclick="setPanelTheme('light')">☀ Claro</button><button type="button" class="btn light" data-theme-choice="dark" onclick="setPanelTheme('dark')">☾ Escuro</button></div><p class="subtle" style="font-size:12px" data-theme-label></p></div>${cloud.on&&['nutricionista','master','administrador'].includes(user.role)?`<div class="panel"><h3>Dados da versão anterior</h3><p class="subtle" style="font-size:13px">Traga ${user.role==='nutricionista'?'seu perfil e sua agenda':'os anúncios'} do arquivo exportado da versão de demonstração.</p><a class="btn light small" href="#importar-dados">Importar dados ↗</a></div>`:''}`;syncPanelTheme();const ownerId=user.id;$('#accountForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),button=$('#accountSave');button.disabled=true;try{const result=await saveAccountChanges(ownerId,{name:f.get('name'),email:f.get('email'),confirmEmail:f.get('confirmEmail'),currentPassword:f.get('old'),nextPassword:f.get('next'),phone:f.get('phone')});dashboard();toast(result.emailChanged?'E-mail atualizado. Use o novo e-mail no próximo acesso.':'Conta atualizada.')}catch(err){const error=$('#accountError');if(error)error.textContent=err.message}finally{if(button.isConnected)button.disabled=false}}}
async function saveAccountChanges(ownerId,fields){if(cloud.on)return cloudSaveAccount(ownerId,fields);if(!user||user.id!==ownerId)throw Error('Entre novamente para alterar a conta.');let latest=db;try{const stored=localStorage.getItem(key);if(stored){const parsed=JSON.parse(stored);if(Array.isArray(parsed?.users))latest=parsed}}catch{}const original=latest.users.find(u=>u.id===ownerId);if(!original)throw Error('Conta não encontrada.');const name=String(fields.name||'').trim();if(!name||name.length>100)throw Error('Informe um nome válido.');const email=original.role==='nutricionista'?String(fields.email||'').trim().toLowerCase():original.email;const emailChanged=email!==original.email;if(original.role==='nutricionista'&&(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||email.length>254))throw Error('Informe um e-mail válido.');if(emailChanged&&String(fields.confirmEmail||'').trim().toLowerCase()!==email)throw Error('A confirmação do novo e-mail não confere.');if(emailChanged&&latest.users.some(u=>u.id!==ownerId&&String(u.email||'').trim().toLowerCase()===email))throw Error('Este e-mail já está cadastrado.');const next=String(fields.nextPassword||'');if(next&&next.length<8)throw Error('A nova senha deve ter pelo menos 8 caracteres.');if(emailChanged||next){if(!fields.currentPassword||await hash(String(fields.currentPassword))!==original.password)throw Error('A senha atual está incorreta.')}let phone=original.phone||'';if(original.role==='paciente'){phone=rxPhone(String(fields.phone||''));if(!phone)throw Error('Informe o celular com DDD, por exemplo (47) 99999-9999. Ele é o seu login.');if(phone!==rxPhone(original.phone||'')&&(!fields.currentPassword||await hash(String(fields.currentPassword))!==original.password))throw Error('Para trocar o celular de login, informe sua senha atual.');if(phone&&latest.users.some(u=>u.id!==ownerId&&u.role==='paciente'&&rxPhone(u.phone||'')===phone))throw Error('Este WhatsApp já está vinculado a outra conta.')}const password=next?await hash(next):original.password;if(user?.id!==ownerId)throw Error('Sua sessão mudou. Entre novamente para salvar.');const updated={...original,name,email,password,...(original.role==='paciente'?{phone}:{})};const previous=db;db={...latest,users:latest.users.map(u=>u.id===ownerId?updated:u)};if(!persist()){db=previous;throw Error('A alteração não foi salva. Verifique o espaço disponível.')}user=updated;return {emailChanged}}

function adForm(id){if(!adCanManage())return;const a=db.ads.find(a=>a.id===id)||{};let pendingImage=a.image||'',reading=false;modal(id?'Editar publicidade':'Nova publicidade',`<form id="adForm"><div class="grid2"><div><label for="adTitle">Título</label><input id="adTitle" name="title" required maxlength="100" value="${esc(a.title||'')}"></div><div><label for="adAdvertiser">Nome do anunciante</label><input id="adAdvertiser" name="advertiser" maxlength="80" value="${esc(a.advertiser||'')}"></div></div><label for="adText">Descrição</label><textarea id="adText" name="text" required maxlength="300">${esc(a.text||'')}</textarea><div class="grid2"><div><label for="adSize">Tamanho da publicidade</label><select id="adSize" name="size"><option value="standard">Padrão — cartão como os perfis</option><option value="full" ${adSize(a)==='full'?'selected':''}>Largura total — linha inteira</option></select></div><div><label for="adPosition">Posição na página inicial</label><select id="adPosition" name="position"><option value="top" ${adPosition(a)==='top'?'selected':''}>Superior — antes da apresentação</option><option value="bottom" ${adPosition(a)==='bottom'?'selected':''}>Inferior — no final da página</option></select></div></div><label for="adImage">Imagem · menos de 1 MB (JPG, PNG ou WebP)</label><input id="adImage" name="image" type="file" accept="image/png,image/jpeg,image/webp"><div class="grid2"><div><label for="adFit">Ajuste da imagem</label><select id="adFit" name="fit"><option value="contain">Mostrar imagem completa</option><option value="cover" ${a.fit==='cover'?'selected':''}>Preencher com recorte</option></select></div><div><label for="adButton">Texto do botão</label><input id="adButton" name="button" maxlength="35" value="${esc(a.button||'Saiba mais')}"></div></div><label for="adUrl">Link do botão (HTTPS, opcional)</label><input id="adUrl" name="url" type="url" placeholder="https://..." value="${esc(a.url||'')}"><p class="subtle" style="font-size:11px">Sem link, o cartão será informativo. “Imagem completa” preserva os textos de anúncios prontos.</p><label class="row"><input name="active" type="checkbox" style="width:auto" ${a.active!==false?'checked':''}> Publicar na página inicial</label><div class="error" id="adError" role="alert"></div><button class="btn wide" id="saveAd">Salvar publicidade</button><div class="ad-preview-head">PRÉVIA DO ANÚNCIO</div><div id="adPreview" class="ad-preview"></div></form>`);const preview=()=>{const f=new FormData($('#adForm'));$('#adPreview').innerHTML=adCard({title:f.get('title')||'Título do anúncio',text:f.get('text')||'Descrição da publicidade.',advertiser:f.get('advertiser'),button:f.get('button'),url:f.get('url'),size:f.get('size'),image:pendingImage,fit:f.get('fit')});$('#adPreview').classList.toggle('preview-wide',f.get('size')==='full');$('#adPreview').querySelectorAll('a').forEach(l=>{l.tabIndex=-1;l.onclick=e=>e.preventDefault()})};preview();$('#adForm').oninput=e=>{if(e.target.type!=='file')preview()};$('#adImage').onchange=async e=>{reading=true;$('#saveAd').disabled=true;try{const img=await readImage(e.target.files[0]);if(img)pendingImage=img;$('#adError').textContent='';preview()}catch(err){e.target.value='';$('#adError').textContent=err.message}finally{reading=false;$('#saveAd').disabled=false}};$('#adForm').onsubmit=e=>{e.preventDefault();if(reading)return;const f=new FormData(e.target),title=String(f.get('title')||'').trim(),text=f.get('text').trim(),url=f.get('url').trim();if(!title||!text){$('#adError').textContent='Preencha título e descrição.';return}if(url&&!safeUrl(url)){$('#adError').textContent='Informe um link HTTPS válido.';return}const data={...a,id:id||uid(),title,text,advertiser:f.get('advertiser').trim(),url,button:f.get('button').trim()||'Saiba mais',active:f.has('active'),image:pendingImage,size:f.get('size')==='full'?'full':'standard',position:f.get('position')==='top'?'top':'bottom',fit:f.get('fit')==='cover'?'cover':'contain'};const old=JSON.stringify(db.ads);if(id)Object.assign(a,data);else db.ads.push(data);if(!persist()){db.ads=JSON.parse(old);return}closeModal();dashboard();toast('Publicidade salva: '+adCaption(data)+'.')}}
let calendarMonth=localDate().slice(0,7),calendarDay=localDate(),calendarFilter='all';
function calendarRows(date){if(user?.role!=='nutricionista')return [];return db.slots.filter(s=>s.pro===user.id&&s.date===date).sort((a,b)=>a.time.localeCompare(b.time)).map(s=>{const booking=db.bookings.find(b=>b.slot===s.id&&b.status!=='cancelada');return {slot:s,booking,state:booking?.status==='concluida'?'done':booking?'booked':future(s)?'free':'past'}})}
function calendarCounts(date){const rows=calendarRows(date);return {free:rows.filter(r=>r.state==='free').length,booked:rows.filter(r=>r.state==='booked').length,done:rows.filter(r=>r.state==='done').length}}
function calendarDates(month){const [year,m]=month.split('-').map(Number),days=new Date(year,m,0).getDate();return Array.from({length:days},(_,i)=>month+'-'+String(i+1).padStart(2,'0'))}
function calendarMove(amount){const [y,m]=calendarMonth.split('-').map(Number);calendarMonth=localDate(new Date(y,m-1+amount,1,12)).slice(0,7);calendarDay=calendarMonth+'-01';renderCalendar()}

function renderCalendar(){if(user?.role!=='nutricionista')return;const dates=calendarDates(calendarMonth),[y,m]=calendarMonth.split('-').map(Number),offset=(new Date(y,m-1,1,12).getDay()+6)%7;const monthName=new Date(y,m-1,1,12).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});const totals=dates.reduce((a,d)=>{const c=calendarCounts(d);return {free:a.free+c.free,booked:a.booked+c.booked,done:a.done+c.done}},{free:0,booked:0,done:0});const dayLabel=new Date(calendarDay+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});const rows=calendarRows(calendarDay).filter(r=>calendarFilter==='all'||r.state===calendarFilter);$('#dashContent').innerHTML=`<div class="panel calendar-panel"><div class="between"><div><div class="eyebrow">Minha agenda</div><h3 style="text-transform:capitalize">${esc(monthName)}</h3></div><div class="row"><button class="btn small light" aria-label="Mês anterior" onclick="calendarMove(-1)">‹</button><button class="btn small light" onclick="calendarToday()">Hoje</button><button class="btn small light" aria-label="Próximo mês" onclick="calendarMove(1)">›</button></div></div><div class="calendar-summary"><span class="calendar-key free">● ${totals.free} horários livres</span><span class="calendar-key booked">● ${totals.booked} consultas agendadas</span><span class="calendar-key done">● ${totals.done} concluídas</span></div><p class="subtle" style="font-size:11px">Clique em um dia para ver seus horários e pacientes. Horário local do navegador.</p><div class="calendar-grid"><div class="calendar-weekday">Seg</div><div class="calendar-weekday">Ter</div><div class="calendar-weekday">Qua</div><div class="calendar-weekday">Qui</div><div class="calendar-weekday">Sex</div><div class="calendar-weekday">Sáb</div><div class="calendar-weekday">Dom</div>${'<div class="calendar-blank" aria-hidden="true"></div>'.repeat(offset)}${dates.map(d=>{const c=calendarCounts(d);return `<button class="calendar-cell ${d===calendarDay?'selected':''} ${d===localDate()?'today':''} ${d<localDate()?'past-day':''}" aria-pressed="${d===calendarDay}" aria-label="${rxDate(d)}: ${c.free} horários livres, ${c.booked} consultas agendadas, ${c.done} concluídas" onclick="calendarSelect('${d}')"><span class="calendar-number">${Number(d.slice(-2))}</span><div class="calendar-indicators">${c.free?`<span class="free">${c.free}<span class="calendar-word"> livres</span></span>`:''}${c.booked?`<span class="booked">${c.booked}<span class="calendar-word"> agend.</span></span>`:''}${c.done?`<span class="done">${c.done}<span class="calendar-word"> concl.</span></span>`:''}${!c.free&&!c.booked&&!c.done?'<span class="calendar-none">—</span>':''}</div></button>`}).join('')}</div><p class="subtle" style="font-size:11px">Verde: horário livre futuro · Azul: consulta agendada · Bege: concluída · Traço: sem horários futuros livres ou consultas.</p></div><div class="panel"><div class="between"><h3 style="font-size:18px;text-transform:capitalize">${esc(dayLabel)}</h3>${calendarDay>=localDate()?`<button class="btn small" onclick="calendarAvailability('${calendarDay}')">+ Disponibilizar horários</button>`:''}</div><div class="filters">${[['all','Todos'],['free','Livres'],['booked','Agendados'],['done','Concluídos']].map(([k,l])=>`<button class="chip ${calendarFilter===k?'active':''}" onclick="calendarFilter='${k}';renderCalendar()">${l}</button>`).join('')}</div>${rows.map(r=>r.booking?appointmentRow(r.booking):`<div class="listitem"><div><b>${r.slot.time}</b> <span class="badge ${r.state==='free'?'free':''}">${r.state==='free'?'Horário livre':'Horário passado'}</span></div>${r.state==='free'?`<button class="btn small danger" onclick="calendarRemove('${r.slot.id}')">Remover horário</button>`:''}</div>`).join('')||'<div class="empty">Nenhum horário neste dia para o filtro escolhido.</div>'}</div>`}

function info(){modal('Sobre esta versão',`${cloud.on?'<p><b>Dados na nuvem:</b> esta instalação salva cadastros, agendas e prontuários no Firebase (Google), com login seguro e regras de acesso por perfil. O aviso abaixo sobre dados no navegador vale só para o modo de demonstração. Antes de usar dados reais de pacientes, revise a política de privacidade e os requisitos da LGPD.</p>':''}<p>O NutriViva é uma primeira versão HTML interativa para validar a experiência do consultório.</p><p class="note">Cadastros, senhas, fotos, agendas, consultas e publicidade ficam somente neste navegador. As permissões são demonstrativas e podem ser alteradas por quem tem acesso ao navegador. Use apenas dados fictícios.</p><p>Para operação real, é necessário conectar autenticação segura, banco de dados compartilhado e autorização no servidor. Esta versão armazena históricos, anamnese, medidas e receituários de demonstração somente neste navegador. Não use dados clínicos reais neste ambiente local de testes. Os botões de compartilhamento abrem o e-mail ou WhatsApp para revisão e envio manual; não há envio automático nem assinatura digital. Não processa pagamentos.</p><p>O atendimento automático pelo WhatsApp funciona aqui como simulador, usando a mesma agenda deste navegador. Para atender pelo WhatsApp de verdade, é preciso publicar o servidor do robô (pasta whatsapp-bot) conectado à API oficial do WhatsApp.</p><p>As videochamadas são abertas em um serviço externo. O nutricionista pode criar uma sala no Google Meet, copiar o link e salvá-lo por consulta. O link da consulta tem prioridade sobre a sala padrão do profissional. Não há retorno automático do link nem sincronização entre aparelhos.</p>`)}

function rxForm(id='',patientId=''){if(user?.role!=='nutricionista')return;const old=id?rxGet(id):null;if(id&&(!old||!rxCanEdit(old)))return;const patients=rxPatients();if(old&&!patients.some(p=>p.id===old.patient)){const p=db.users.find(u=>u.id===old.patient);if(p)patients.push(p)}if(!patients.length){toast('Vincule um paciente em “Meus pacientes” ou agende uma consulta para criar o receituário.');return}modal(id?'Editar receituário':'Novo receituário',`<form id="rxForm"><label for="rxPatient">Paciente do meu consultório</label><select id="rxPatient" name="patient" required ${id?'disabled':''}>${patients.map(p=>`<option value="${p.id}" ${(old?.patient||patientId)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="grid2"><div><label for="rxDate">Data do documento</label><input id="rxDate" name="date" type="date" value="${esc(old?.date||localDate())}" required></div><div><label for="rxReturn">Retorno (opcional)</label><input id="rxReturn" name="returnDate" type="date" value="${esc(old?.returnDate||'')}"></div></div><label for="rxTitle">Título</label><input id="rxTitle" name="title" required maxlength="100" value="${esc(old?.title||'Receituário nutricional')}"><label for="rxContent">Prescrição / orientações do nutricionista</label><textarea id="rxContent" name="content" required maxlength="12000" style="min-height:180px" placeholder="Escreva as orientações individualizadas para o paciente...">${esc(old?.content||'')}</textarea><label for="rxNotes">Observações adicionais (opcional)</label><textarea id="rxNotes" name="notes" maxlength="4000">${esc(old?.notes||'')}</textarea><div class="grid2"><div><label for="rxEmail">E-mail do paciente</label><input id="rxEmail" name="email" type="email" value="${esc(old?.email||'')}"></div><div><label for="rxPhone">WhatsApp do paciente</label><input id="rxPhone" name="phone" type="tel" placeholder="55 + DDD + número" value="${esc(old?.phone||'')}"></div></div><label for="rxStatus">Disponibilidade</label><select id="rxStatus" name="status"><option value="rascunho">Rascunho — somente eu visualizo</option><option value="disponivel" ${old?.status==='disponivel'?'selected':''}>Disponibilizar ao paciente</option></select><p class="note">Profissional: ${esc(user.name)} · ${esc(user.crn)}.<br>O nome e o CRN serão incluídos no documento; não equivalem a uma assinatura digital. A confirmação do envio acontece no seu aplicativo de e-mail ou WhatsApp.</p><div class="error" id="rxError" role="alert"></div><button class="btn wide">Salvar receituário</button></form>`);const fillEmail=()=>{const p=db.users.find(p=>p.id===$('#rxPatient').value);$('#rxEmail').value=p?.email||'';$('#rxPhone').value=p?.phone||''};if(!old)fillEmail();$('#rxPatient').onchange=fillEmail;$('#rxForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const patient=old?.patient||f.get('patient');const p=patients.find(p=>p.id===patient);if(!p)return;const content=String(f.get('content')||'').trim(),title=String(f.get('title')||'').trim();if(!content||!title){$('#rxError').textContent='Preencha o título e as orientações.';return}if(f.get('returnDate')&&f.get('returnDate')<f.get('date')){$('#rxError').textContent='O retorno deve ser na data do documento ou depois.';return}const data={id:old?.id||uid(),pro:user.id,patient:p.id,patientName:p.name,proName:user.name,crn:user.crn||'',date:f.get('date'),returnDate:f.get('returnDate'),title,content,notes:f.get('notes').trim(),email:f.get('email').trim(),phone:f.get('phone').trim(),status:f.get('status'),updated:new Date().toISOString(),created:old?.created||new Date().toISOString(),revisions:old?[...(old.revisions||[]),Object.fromEntries(Object.entries(old).filter(([k])=>k!=='revisions'))]:[]};const previous=db.prescriptions;db.prescriptions=old?rxItems().map(r=>r.id===old.id?data:r):[...rxItems(),data];if(!persist()){db.prescriptions=previous;return}closeModal();tab='receituarios';dashboard();toast(data.status==='disponivel'?'Receituário disponível ao pacie function rxPrint(id){const r=rxGet(id);if(!r)return;let area=$('#rxPrintArea');if(!area){area=document.createElement('div');area.id='rxPrintArea';document.body.appendChild(area)}area.innerHTML=rxDocument(r);document.body.classList.add('rx-printing');const previousTitle=document.title;document.title='Receituario-'+r.date;const cleanup=()=>{document.body.classList.remove('rx-printing');document.title=previousTitle;area.innerHTML='';window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);try{window.print()}catch{cleanup();toast('A impressão não abriu. Tente novamente no navegador.')}}

function patientSet(){if(user?.role!=='nutricionista')return new Set();const ids=new Set(db.bookings.filter(b=>db.slots.some(s=>s.id===b.slot&&s.pro===user.id)).map(b=>b.patient));for(const key of ['patientLinks','clinicalEntries','anamneses','prescriptions'])for(const item of db[key]||[])if(item.pro===user.id)ids.add(item.patient);return ids}
function myPatients(){const ids=patientSet();return db.users.filter(p=>p.role==='paciente'&&ids.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'))}

function patientBookings(id){if(!myPatient(id))return [];return db.bookings.filter(b=>b.patient===id&&db.slots.some(s=>s.id===b.slot&&s.pro===user.id)).sort((a,b)=>when(db.slots.find(s=>s.id===b.slot))-when(db.slots.find(s=>s.id===a.slot)))}
function patientEntries(id,type){if(!myPatient(id))return [];return (db.clinicalEntries||[]).filter(e=>e.pro===user.id&&e.patient===id&&(!type||e.type===type)).sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created))}
function patientRecipes(id){if(!myPatient(id))return [];return rxItems().filter(r=>r.pro===user.id&&r.patient===id).sort((a,b)=>b.date.localeCompare(a.date)||b.updated.localeCompare(a.updated))}
function patientAnamnesis(id){if(!myPatient(id))return null;return (db.anamneses||[]).find(a=>a.pro===user.id&&a.patient===id)||null}
function patientNumber(v){return v===null||v===undefined||v===''?'—':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2})}
