function renderPatients(){if(user?.role!=='nutricionista')return;if(historyPatient&&!myPatient(historyPatient))historyPatient='';if(historyPatient)return renderPatientDetail();$('#dashContent').innerHTML=`<div class="panel"><div class="between"><div><div class="eyebrow">Acompanhamento individual</div><h3>Meus pacientes</h3></div><button class="btn small" onclick="linkPatientForm()">+ Vincular paciente</button></div><p class="note">Histórico de cada paciente com consultas, medidas, receitas, exames e anotações. Dados apenas deste nutricionista. Demonstração: use somente dados fictícios; as permissões são locais e não substituem autenticação segura.</p><label for="historySearch">Buscar paciente</label><input id="historySearch" type="search" placeholder="Digite o nome do paciente" oninput="patientList(this.value)"><div id="patientList"></div></div>`;patientList('')}
function patientList(query){if(user?.role!=='nutricionista')return;const patients=myPatients().filter(p=>p.name.toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR')));$('#patientList').innerHTML=patients.map(p=>{const visits=patientBookings(p.id),measures=patientEntries(p.id,'measure'),recipes=patientRecipes(p.id);return `<div class="listitem"><div><h4>${esc(p.name)}</h4><p>${esc(p.email||'')}<br>${visits.length} consulta(s) · ${measures.length} avaliação(ões) de medidas · ${recipes.length} receituário(s)</p></div><button class="btn small" onclick="historyOpen('${p.id}')">Abrir histórico ↗</button></div>`}).join('')||'<div class="empty">Nenhum paciente encontrado. Pacientes da sua agenda aparecem aqui automaticamente; você também pode vincular um paciente já cadastrado.</div>'}
function linkPatientForm(){if(user?.role!=='nutricionista')return;const patients=db.users.filter(p=>p.role==='paciente'&&!patientSet().has(p.id));if(!patients.length){toast('Todos os pacientes cadastrados já estão vinculados. Novos pacientes devem fazer o cadastro na página inicial.');return}modal('Vincular paciente ao meu consultório',`<form id="patientLinkForm"><label for="patientLinkSelect">Paciente já cadastrado</label><select id="patientLinkSelect" required>${patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><p class="note">O vínculo permite iniciar um histórico no seu consultório. As anotações de outros nutricionistas não são compartilhadas.</p><button class="btn wide">Vincular e abrir histórico</button></form>`);$('#patientLinkForm').onsubmit=e=>{e.preventDefault();const id=$('#patientLinkSelect').value;if(!patients.some(p=>p.id===id)||user?.role!=='nutricionista')return;const previous=db.patientLinks;db.patientLinks=[...(db.patientLinks||[]),{id:uid(),patient:id,pro:user.id,created:new Date().toISOString()}];if(!persist()){db.patientLinks=previous;return}closeModal();historyOpen(id);toast('Paciente vinculado.')}}
function renderPatientDetail(){const p=myPatient(historyPatient);if(!p)return;const ms=patientEntries(p.id,'measure'),bookings=patientBookings(p.id),recipes=patientRecipes(p.id),latestWeight=ms.find(e=>e.values?.weight!==undefined&&e.values.weight!==null);$('#dashContent').innerHTML=`<button class="back" onclick="historyBack()">← Meus pacientes</button><div class="panel patient-header"><div class="between"><div><div class="eyebrow">Histórico individual</div><h2 style="font-size:26px">${esc(p.name)}</h2><p class="subtle" style="font-size:12px;margin:5px 0">${esc(p.email||'')}</p></div><span class="badge">Consultório de ${esc(user.name)}</span></div><div class="history-summary"><div><small>Consultas concluídas</small><strong>${bookings.filter(b=>b.status==='concluida').length}</strong></div><div><small>Último peso registrado</small><strong>${latestWeight?patientNumber(latestWeight.values.weight)+' kg':'—'}</strong><small>${latestWeight?rxDate(latestWeight.date):'Sem medidas'}</small></div><div><small>Receituários</small><strong>${recipes.length}</strong></div></div><div class="history-tabs">${[['resumo','Linha do tempo'],['medidas','Medidas'],['consultas','Consultas'],['receitas','Receitas'],['registros','Atendimentos e registros'],['anamnese','Anamnese']].map(([k,l])=>`<button class="chip ${historyView===k?'active':''}" onclick="historyTab('${k}')">${l}</button>`).join('')}</div></div><div id="patientContent"></div><p class="note">Histórico interno do nutricionista neste navegador. O paciente vê apenas os receituários disponibilizados para ele. Use dados fictícios nesta versão de testes.</p>`;const content=$('#patientContent');if(historyView==='resumo'){const timeline=patientTimeline(p.id);content.innerHTML=`<div class="panel"><div class="between"><h3>Linha do tempo do acompanhamento</h3><div class="row"><button class="btn small" onclick="entryForm('visit','${p.id}')">+ Atendimento</button><button class="btn small light" onclick="entryForm('measure','${p.id}')">+ Medidas</button></div></div>${timeline.map(t=>`<div class="history-event"><div class="history-eventdate">${rxDate(t.date)}</div><div><span class="badge">${esc(t.kind)}</span><h4 style="margin-top:8px">${esc(t.title)}</h4><p class="subtle" style="font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(t.summary)}</p><button class="btn light small" onclick="${t.action}">Ver detalhes</button></div></div>`).join('')||'<div class="empty">Nenhum evento registrado. Comece com uma avaliação de medidas ou um atendimento.</div>'}</div>`}if(historyView==='medidas')renderMeasures(p.id);if(historyView==='consultas'){content.innerHTML=`<div class="panel"><h3>Consultas deste paciente</h3><p class="subtle" style="font-size:12px">Inclui agendadas, concluídas e canceladas com este nutricionista.</p>${bookings.map(appointmentRow).join('')||'<div class="empty">Nenhuma consulta agendada.</div>'}</div>`}if(historyView==='receitas'){content.innerHTML=`<div class="panel"><div class="between"><h3>Receituários do paciente</h3><button class="btn small" onclick="rxForm('','${p.id}')">+ Novo receituário</button></div>${recipes.map(r=>`<div class="listitem"><div><span class="badge">${r.status==='disponivel'?'Disponível ao paciente':'Rascunho'}</span><h4 style="margin-top:8px">${esc(r.title)}</h4><p>${rxDate(r.date)}</p></div><div class="row"><button class="btn light small" onclick="rxView('${r.id}')">Visualizar</button><button class="btn light small" onclick="rxForm('${r.id}')">Editar</button><button class="btn light small" onclick="rxPrint('${r.id}')">PDF</button>${r.status==='disponivel'?`<button class="btn small" onclick="rxShare('${r.id}')">Compartilhar</button>`:''}</div></div>`).join('')||'<div class="empty">Nenhum receituário deste profissional para o paciente.</div>'}</div>`}if(historyView==='registros'){content.innerHTML=`<div class="panel"><div class="between"><h3>Atendimentos e registros</h3><div class="row"><button class="btn small" onclick="entryForm('visit','${p.id}')">+ Atendimento</button><button class="btn small light" onclick="entryForm('exam','${p.id}')">+ Exame</button><button class="btn small light" onclick="entryForm('note','${p.id}')">+ Anotação</button></div></div>${patientEntries(p.id).filter(e=>e.type!=='measure').map(e=>`<div class="listitem"><div><span class="badge">${entryLabel(e.type)}</span><h4 style="margin-top:8px">${esc(e.title)}</h4><p>${rxDate(e.date)}${e.returnDate?' · Retorno: '+rxDate(e.returnDate):''}</p></div><div class="row"><button class="btn small light" onclick="entryView('${e.id}')">Ver registro</button><button class="btn small light" onclick="entryForm('${e.type}','${p.id}','${e.id}')">Editar</button></div></div>`).join('')||'<div class="empty">Nenhuma evolução, exame ou anotação registrado.</div>'}</div>`}if(historyView==='anamnese')renderAnamnesis(p.id)}
function patientTimeline(id){if(!myPatient(id))return [];const entries=patientEntries(id).map(e=>({date:e.date,sort:e.date+'T'+e.created.slice(11),kind:entryLabel(e.type),title:e.title,summary:e.type==='measure'?measureFields.filter(([k])=>e.values?.[k]!==undefined&&e.values[k]!==null).map(([k,label,unit])=>label+': '+patientNumber(e.values[k])+' '+unit).join(' · '):(e.content||e.complaint||e.plan||'Registro de atendimento').slice(0,280),action:`entryView('${e.id}')`}));for(const b of patientBookings(id)){const s=db.slots.find(s=>s.id===b.slot);entries.push({date:s.date,sort:s.date+'T'+s.time,kind:'Consulta',title:s.time+' · '+b.status,summary:'Consulta com '+user.name,action:"historyTab('consultas')"})}for(const r of patientRecipes(id))entries.push({date:r.date,sort:r.date+'T'+r.updated.slice(11),kind:'Receituário',title:r.title,summary:r.status==='disponivel'?'Disponível ao paciente':'Rascunho',action:`rxView('${r.id}')`});const a=patientAnamnesis(id);if(a)entries.push({date:a.updated.slice(0,10),sort:a.updated,kind:'Anamnese',title:'Anamnese atualizada',summary:(a.goal||'Informações de acompanhamento').slice(0,280),action:"historyTab('anamnese')"});return entries.sort((a,b)=>b.sort.localeCompare(a.sort))}
function entryLabel(t){return ({measure:'Avaliação de medidas',visit:'Atendimento / evolução',exam:'Exame',note:'Anotação'})[t]||'Registro'}
function renderMeasures(id){const rows=patientEntries(id,'measure');$('#patientContent').innerHTML=`<div class="panel"><div class="between"><div><h3>Medidas e evolução</h3><p class="subtle" style="font-size:12px">Histórico por data. Valores informados pelo nutricionista, sem classificação automática.</p></div><button class="btn small" onclick="entryForm('measure','${id}')">+ Cadastrar medidas</button></div><div class="tablewrap"><table><thead><tr><th>Data</th>${measureFields.map(([,l,u])=>`<th>${l} (${u})</th>`).join('')}<th>Ações</th></tr></thead><tbody>${rows.map(e=>`<tr><td style="white-space:nowrap">${rxDate(e.date)}</td>${measureFields.map(([k])=>`<td>${patientNumber(e.values?.[k])}</td>`).join('')}<td><button class="btn light small" onclick="entryView('${e.id}')">Ver</button><button class="btn light small" onclick="entryForm('measure','${id}','${e.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">Ainda não há medidas cadastradas.</div>'}</div>`}
function ownEntry(id){if(user?.role!=='nutricionista')return null;return (db.clinicalEntries||[]).find(e=>e.id===id&&e.pro===user.id&&myPatient(e.patient))||null}
function entryForm(type,patientId,id=''){const p=myPatient(patientId),old=id?ownEntry(id):null;if(!p||!['measure','visit','exam','note'].includes(type)||id&&(!old||old.patient!==patientId||old.type!==type))return;const visits=patientBookings(patientId);modal(id?'Editar registro':'Novo registro: '+entryLabel(type),`<form id="clinicalForm"><p><b>Paciente:</b> ${esc(p.name)}</p><div class="grid2"><div><label for="clinicalDate">Data do registro</label><input id="clinicalDate" name="date" type="date" max="${localDate()}" value="${esc(old?.date||localDate())}" required></div><div><label for="clinicalBooking">Consulta vinculada (opcional)</label><select id="clinicalBooking" name="booking"><option value="">Sem vínculo</option>${visits.map(b=>{const s=db.slots.find(s=>s.id===b.slot);return `<option value="${b.id}" ${old?.booking===b.id?'selected':''}>${rxDate(s.date)} ${s.time} · ${b.status}</option>`}).join('')}</select></div></div><label for="clinicalTitle">Título</label><input id="clinicalTitle" name="title" required maxlength="120" value="${esc(old?.title||entryLabel(type))}">${type==='measure'?`<div class="grid2">${measureFields.map(([k,l,u])=>`<div><label for="m-${k}">${l} (${u})</label><input id="m-${k}" name="${k}" type="number" min="${k==='bodyFat'?'0':'0.01'}" ${k==='bodyFat'?'max="100"':''} step="0.01" value="${old?.values?.[k]??''}"></div>`).join('')}</div><label for="clinicalContent">Observações sobre as medidas (opcional)</label><textarea id="clinicalContent" name="content" maxlength="6000">${esc(old?.content||'')}</textarea>`:type==='visit'?`<label for="clinicalComplaint">Queixa / objetivo relatado</label><textarea id="clinicalComplaint" name="complaint" maxlength="6000">${esc(old?.complaint||'')}</textarea><label for="clinicalAssessment">Avaliação e evolução registradas pelo nutricionista</label><textarea id="clinicalAssessment" name="assessment" maxlength="10000">${esc(old?.assessment||'')}</textarea><label for="clinicalPlan">Condutas, orientações e plano de acompanhamento</label><textarea id="clinicalPlan" name="plan" maxlength="10000">${esc(old?.plan||'')}</textarea><label for="clinicalReturn">Previsão de retorno (opcional)</label><input id="clinicalReturn" name="returnDate" type="date" value="${esc(old?.returnDate||'')}">`:`<label for="clinicalContent">${type==='exam'?'Exame, data da coleta, resultados e observações':'O que foi tratado com o paciente'}</label><textarea id="clinicalContent" name="content" maxlength="12000" required style="min-height:180px">${esc(old?.content||'')}</textarea>`}<p class="note">Registro interno deste nutricionista. Ao editar, a versão anterior é preservada. Use dados fictícios na demonstração.</p><div id="clinicalError" class="error" role="alert"></div><button class="btn wide">Salvar no histórico</button></form>`);$('#clinicalForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data={date:f.get('date'),booking:f.get('booking'),title:String(f.get('title')||'').trim(),content:String(f.get('content')||'').trim(),complaint:String(f.get('complaint')||'').trim(),assessment:String(f.get('assessment')||'').trim(),plan:String(f.get('plan')||'').trim(),returnDate:f.get('returnDate')};if(type==='measure'){data.values={};for(const [k]of measureFields){const v=f.get(k);if(v!==''&&v!==null)data.values[k]=Number(v)}}try{saveClinicalEntry(patientId,type,data,id);closeModal();historyPatient=patientId;tab='pacientes';historyView=type==='measure'?'medidas':'registros';dashboard();toast('Registro salvo no histórico.')}catch(err){$('#clinicalError').textContent=err.message}}}
function saveClinicalEntry(patientId,type,input,id=''){if(!myPatient(patientId))throw Error('Paciente não vinculado a este nutricionista.');if(!['measure','visit','exam','note'].includes(type))throw Error('Tipo de registro inválido.');const old=id?ownEntry(id):null;if(id&&(!old||old.patient!==patientId||old.type!==type))throw Error('Registro não disponível.');if(!/^\d{4}-\d{2}-\d{2}$/.test(input.date)||Number.isNaN(new Date(input.date+'T12:00').getTime())||localDate(new Date(input.date+'T12:00'))!==input.date||input.date>localDate())throw Error('Informe uma data válida, até hoje.');if(!input.title?.trim())throw Error('Preencha o título.');if(input.booking&&!patientBookings(patientId).some(b=>b.id===input.booking))throw Error('A consulta selecionada não pertence a este paciente e profissional.');if(input.returnDate&&input.returnDate<input.date)throw Error('A previsão de retorno deve ser a partir da data do atendimento.');if(type==='measure'){const pairs=Object.entries(input.values||{});if(!pairs.length)throw Error('Preencha pelo menos uma medida.');for(const[k,v]of pairs)if(!measureFields.some(([f])=>f===k)||!Number.isFinite(v)||(k==='bodyFat'?v<0||v>100:v<=0))throw Error('Confira os valores das medidas; use números positivos e percentual entre 0 e 100.')}else if(type==='visit'){if(![input.complaint,input.assessment,input.plan].some(v=>v?.trim()))throw Error('Preencha pelo menos um campo do atendimento.')}else if(!input.content?.trim())throw Error('Preencha o conteúdo do registro.');const now=new Date().toISOString(),revisions=old?[...(old.revisions||[]),Object.fromEntries(Object.entries(old).filter(([k])=>k!=='revisions'))]:[];const data={...input,id:old?.id||uid(),patient:patientId,pro:user.id,proName:user.name,type,created:old?.created||now,updated:now,revisions};const previous=db.clinicalEntries;db.clinicalEntries=old?(previous||[]).map(e=>e.id===id?data:e):[...(previous||[]),data];if(!persist()){db.clinicalEntries=previous;throw Error('O registro não foi salvo. Verifique o espaço disponível no navegador.')}return data}
function entryBody(e){return `${e.type==='measure'?`<div class="measure-values">${measureFields.filter(([k])=>e.values?.[k]!==undefined&&e.values[k]!==null).map(([k,l,u])=>`<div><small>${l}</small><b>${patientNumber(e.values[k])} ${u}</b></div>`).join('')}</div>`:''}${[['complaint','Queixa / objetivo'],['assessment','Avaliação e evolução'],['plan','Condutas e plano'],['content',e.type==='exam'?'Resultados e observações':'Observações']].filter(([k])=>e[k]).map(([k,l])=>`<h4 style="margin-top:20px">${l}</h4><p class="clinical-text">${esc(e[k])}</p>`).join('')}${e.returnDate?`<p><b>Previsão de retorno:</b> ${rxDate(e.returnDate)}</p>`:''}`}
function entryView(id){const e=ownEntry(id);if(!e)return;const p=myPatient(e.patient),b=patientBookings(e.patient).find(b=>b.id===e.booking),slot=db.slots.find(s=>s.id===b?.slot);modal(e.title,`<p><b>${esc(p.name)}</b> · ${rxDate(e.date)}</p><span class="badge">${entryLabel(e.type)}</span>${slot?`<p class="subtle" style="font-size:12px">Consulta vinculada: ${fmt(slot)}</p>`:''}${entryBody(e)}<p class="subtle" style="font-size:11px">Registrado por ${esc(e.proName)} · Atualizado em ${new Date(e.updated).toLocaleString('pt-BR')}</p>${e.revisions.length?`<details class="note"><summary>Versões anteriores (${e.revisions.length})</summary>${e.revisions.slice().reverse().map(r=>`<div style="border-top:1px solid var(--line);margin-top:15px;padding-top:15px"><b>${esc(r.title)} · ${rxDate(r.date)}</b><p>Versão de ${new Date(r.updated).toLocaleString('pt-BR')}</p>${entryBody(r)}</div>`).join('')}</details>`:''}<button class="btn wide" onclick="closeModal();entryForm('${e.type}','${e.patient}','${e.id}')">Editar registro</button>`)}
const anamnesisFields=[['goal','Objetivos do acompanhamento'],['conditions','Histórico de saúde relatado'],['allergies','Alergias, intolerâncias e restrições'],['medications','Medicamentos e suplementos relatados'],['food','Rotina e hábitos alimentares'],['activity','Atividade física, sono e rotina'],['notes','Outras informações relevantes']];
function renderAnamnesis(id){const a=patientAnamnesis(id);$('#patientContent').innerHTML=`<div class="panel"><div class="between"><h3>Anamnese e informações do acompanhamento</h3><button class="btn small" onclick="anamnesisForm('${id}')">${a?'Editar':'Cadastrar'} anamnese</button></div>${a?`${a.birthDate?`<p><b>Data de nascimento:</b> ${rxDate(a.birthDate)}</p>`:''}${a.phone?`<p><b>Contato informado:</b> ${esc(a.phone)}</p>`:''}${anamnesisFields.filter(([k])=>a[k]).map(([k,l])=>`<h4 style="margin-top:22px">${l}</h4><p class="clinical-text">${esc(a[k])}</p>`).join('')}<p class="subtle" style="font-size:11px">Atualizado em ${new Date(a.updated).toLocaleString('pt-BR')}</p>${a.revisions?.length?`<details class="note"><summary>Versões anteriores (${a.revisions.length})</summary>${a.revisions.slice().reverse().map(v=>`<div style="border-top:1px solid var(--line);margin-top:15px"><p><b>${new Date(v.updated).toLocaleString('pt-BR')}</b></p>${v.birthDate?`<p>Data de nascimento: ${rxDate(v.birthDate)}</p>`:''}${v.phone?`<p>Contato: ${esc(v.phone)}</p>`:''}${anamnesisFields.filter(([k])=>v[k]).map(([k,l])=>`<h4>${l}</h4><p class="clinical-text">${esc(v[k])}</p>`).join('')}</div>`).join('')}</details>`:''}`:'<div class="empty">Cadastre o que o paciente relatou para orientar seu acompanhamento.</div>'}</div>`}
function anamnesisForm(id){const p=myPatient(id);if(!p)return;const old=patientAnamnesis(id)||{};modal('Anamnese: '+p.name,`<form id="anamnesisForm"><div class="grid2"><div><label for="aBirth">Data de nascimento (opcional)</label><input id="aBirth" name="birthDate" type="date" max="${localDate()}" value="${esc(old.birthDate||'')}"></div><div><label for="aPhone">Telefone (opcional)</label><input id="aPhone" name="phone" type="tel" maxlength="30" value="${esc(old.phone||'')}"></div></div>${anamnesisFields.map(([k,l])=>`<label for="a-${k}">${l}</label><textarea id="a-${k}" name="${k}" maxlength="8000">${esc(old[k]||'')}</textarea>`).join('')}<div class="error" id="anamnesisError" role="alert"></div><button class="btn wide">Salvar anamnese</button></form>`);$('#anamnesisForm').onsubmit=e=>{e.preventDefault();if(!myPatient(id))return;const f=new FormData(e.target),data={id:old.id||uid(),pro:user.id,patient:id,birthDate:f.get('birthDate'),phone:f.get('phone').trim(),updated:new Date().toISOString(),revisions:old.id?[...(old.revisions||[]),Object.fromEntries(Object.entries(old).filter(([k])=>k!=='revisions'))]:[]};for(const[k]of anamnesisFields)data[k]=f.get(k).trim();if(![data.birthDate,data.phone,...anamnesisFields.map(([k])=>data[k])].some(Boolean)){$('#anamnesisError').textContent='Preencha pelo menos um campo.';return}if(data.birthDate>localDate()){$('#anamnesisError').textContent='Confira a data de nascimento.';return}const previous=db.anamneses;db.anamneses=old.id?(previous||[]).map(a=>a.id===old.id?data:a):[...(previous||[]),data];if(!persist()){db.anamneses=previous;return}closeModal();historyPatient=id;historyView='anamnese';tab='pacientes';dashboard();toast('Anamnese salva no histórico.')}}

let deferredInstall=null,pwaInstallObserved=false,pwaInstallBusy=false,pwaWorkerState='pending';
function pwaAllowed(){return !!user&&['nutricionista','administrador','master'].includes(user.role)}
function pwaStandalone(){return pwaInstallObserved||!!window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone===true}
function pwaPlatform(){const ua=navigator.userAgent||'';if(/iPhone|iPad|iPod/.test(ua)||/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)return 'ios';if(/Android/.test(ua))return 'android';return 'desktop'}
function pwaStatusText(){if(pwaStandalone())return 'Você está usando o NutriViva como app.';if(location.protocol==='file:')return 'Abra a versão publicada para instalar; o arquivo HTML isolado não instala o app.';if(deferredInstall)return 'A instalação está disponível neste navegador.';return 'O navegador decide quando oferecer a instalação. Você também pode usar o menu do navegador.'}
function pwaButton(){return `<button class="btn small light" type="button" data-pwa-install onclick="pwaInstall()" ${pwaStandalone()?'disabled':''}>${pwaStandalone()?'✓ App instalado':'↓ Instalar app'}</button>`}
function pwaRefresh(){document.querySelectorAll('[data-pwa-install]').forEach(b=>{b.disabled=pwaStandalone()||pwaInstallBusy;b.textContent=pwaStandalone()?'✓ App instalado':pwaInstallBusy?'Aguardando navegador…':'↓ Instalar app'});document.querySelectorAll('[data-pwa-status]').forEach(e=>e.textContent=pwaStatusText())}
function pwaGuideHtml(platform=pwaPlatform()){if(platform==='ios')return `<h4>iPhone e iPad</h4><ol><li>Abra a plataforma no Safari.</li><li>Toque em <b>Compartilhar</b> (quadrado com seta para cima).</li><li>Escolha <b>Adicionar à Tela de Início</b> e confirme em <b>Adicionar</b>.</li></ol>`;if(platform==='android')return `<h4>Celular ou tablet Android</h4><ol><li>Abra a plataforma no Chrome.</li><li>Toque no menu <b>⋮</b>.</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b> e confirme.</li></ol>`;return `<h4>Windows, Linux e Chromebook</h4><ol><li>Abra a plataforma no Google Chrome. No Windows, também pode usar o Microsoft Edge.</li><li>Procure o ícone de instalação na barra de endereço, ou abra o menu <b>⋮ / …</b>.</li><li>Escolha <b>Instalar NutriViva</b> ou a opção de instalar a página como aplicativo e confirme.</li></ol><p>No Safari do Mac, use <b>Arquivo → Adicionar ao Dock</b>, quando disponível. Outros navegadores podem oferecer apenas um atalho.</p>`}
function pwaInstructions(){if(!pwaAllowed())return;modal('Instalar o NutriViva',`<div class="pwa-brand"><img src="./icons/icon-192.png" alt="Ícone NutriViva"><div><h3>Seu consultório, a um toque</h3><p>Windows, Linux, celular e tablet</p></div></div><p class="note" data-pwa-status>${pwaStatusText()}</p>${pwaGuideHtml()}<details class="note"><summary>Instruções para outros aparelhos</summary>${['desktop','android','ios'].filter(p=>p!==pwaPlatform()).map(p=>pwaGuideHtml(p)).join('')}</details><p class="note">A instalação depende do navegador e precisa ser confirmada por você. O app abre a mesma plataforma; continua sendo necessário entrar na sua conta. A instalação não sincroniza os dados entre aparelhos. Nesta versão de testes, use dados fictícios.</p>`)}
async function pwaInstall(){if(!pwaAllowed()||pwaInstallBusy)return;if(pwaStandalone()){toast('O NutriViva já está aberto como app.');return}if(!deferredInstall||location.protocol==='file:'){pwaInstructions();return}const prompt=deferredInstall;deferredInstall=null;pwaInstallBusy=true;pwaRefresh();try{await prompt.prompt();const choice=await prompt.userChoice;toast(choice?.outcome==='accepted'?'Instalação aceita. Aguarde a conclusão pelo navegador.':'Instalação não concluída. Você pode tentar novamente pelo menu do navegador.')}catch{pwaInstructions()}finally{pwaInstallBusy=false;pwaRefresh()}}
function renderInstall(){if(!pwaAllowed())return;$('#dashContent').innerHTML=`<div class="panel"><div class="pwa-brand"><img src="./icons/icon-192.png" alt="Ícone NutriViva"><div><div class="eyebrow">Sempre por perto</div><h2>Instale o NutriViva</h2><p>Seu consultório no Windows, Linux, Chromebook, celular ou tablet.</p></div></div><div class="pwa-device-grid"><div><b>▣ Windows e Linux</b><p>Instale pelo navegador e abra em uma janela própria pelo ícone do aplicativo. Também funciona no Chromebook.</p></div><div><b>▯ Celular</b><p>Adicione à tela inicial e acesse com um toque.</p></div><div><b>▤ Tablet</b><p>Use o painel com o layout adaptado à sua tela.</p></div></div><p class="note" data-pwa-status>${pwaStatusText()}</p><div class="row">${pwaButton()}<button class="btn light small" onclick="pwaInstructions()">Como instalar no meu aparelho</button></div><div style="margin-top:25px">${pwaGuideHtml()}</div><p class="note">A instalação adiciona um ícone para abrir esta plataforma; não é preciso baixar nas lojas. É necessária conexão com a internet para abrir o app e usar Meet, e-mail e WhatsApp. Os dados desta demonstração continuam no aparelho e no navegador utilizados, sem sincronização entre dispositivos. Use dados fictícios.</p></div>`}
function setupPwa(){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;pwaRefresh()});window.addEventListener('appinstalled',()=>{pwaInstallObserved=true;deferredInstall=null;pwaRefresh();if(pwaAllowed())toast('NutriViva instalado. Acesse pelo ícone no seu aparelho.')});window.matchMedia?.('(display-mode: standalone)').addEventListener?.('change',pwaRefresh);window.addEventListener('pageshow',pwaRefresh);if('serviceWorker' in navigator&&['https:','http:'].includes(location.protocol)){navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(()=>{pwaWorkerState='ready';pwaRefresh()}).catch(()=>{pwaWorkerState='error'})}else pwaWorkerState='unsupported'}

/* ===== Atendimento automático pelo WhatsApp: simulador e painel da equipe ===== */
let waChatFilter='todas';
function waEnabled(){return db?.whatsapp?.enabled!==false}
function waPhone(){return sessionStorage.getItem('nv-wa-phone')||(user?.role==='paciente'?rxPhone(user.phone||''):'')||'5547999990000'}
function waPretty(n){n=String(n||'');const m=n.match(/^55(\d{2})(\d{4,5})(\d{4})$/);return m?`+55 ${m[1]} ${m[2]}-${m[3]}`:'+'+n}
function waFormat(t){return esc(t).replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/(https:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')}
function waTime(at){return new Date(at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function waBubbles(chat,staffView){return (chat?.messages||[]).map(m=>{const mine=staffView?m.from!=='user':m.from==='user';const who=m.from==='agent'?'Atendente'+(m.by?' · '+esc(m.by):''):staffView&&m.from==='bot'?'Robô':'';return `<div class="wa-msg ${mine?'out':'in'}">${who?`<span class="wa-who">${who}</span>`:''}${waFormat(m.text)}<time>${waTime(m.at)}</time></div>`}).join('')}
function waMount(){if($('#waFab'))return;document.body.insertAdjacentHTML('beforeend',`<button id="waFab" class="wa-fab hidden" type="button" onclick="waToggle()" aria-label="Atendimento pelo WhatsApp" aria-controls="waPanel" aria-expanded="false">✆ <span>Agende pelo WhatsApp</span></button><section id="waPanel" class="wa-panel hidden" aria-label="Atendimento automático pelo WhatsApp"><div class="wa-head"><div><b>NutriViva</b><small>Atendimento automático · simulador</small><span id="waReal"></span></div><button class="wa-x" type="button" aria-label="Fechar atendimento" onclick="waToggle(false)">×</button></div><div class="wa-phone"><label for="waPhoneInput">Seu WhatsApp:</label><input id="waPhoneInput" type="tel" maxlength="30" autocomplete="off"></div><div id="waMsgs" class="wa-msgs" role="log" aria-live="polite"></div><div class="wa-quick">${[['menu','Menu'],['4','Escolher nutricionista'],['1','Agendar'],['2','Minhas consultas'],['5','Link da sala'],['3','Cancelar'],['6','Atendente']].map(([v,l])=>`<button type="button" onclick="waSend('${v}')">${l}</button>`).join('')}</div><form id="waForm" class="wa-form"><input id="waInput" autocomplete="off" maxlength="500" placeholder="Digite uma mensagem" aria-label="Mensagem"><button class="wa-send" aria-label="Enviar">➤</button></form></section>`);$('#waForm').onsubmit=e=>{e.preventDefault();const v=$('#waInput').value;$('#waInput').value='';waSend(v)};$('#waPhoneInput').onchange=e=>{const n=rxPhone(e.target.value);if(!n){toast('Informe o número com DDD, por exemplo 47 99999-9999.');e.target.value=waPretty(waPhone());return}sessionStorage.setItem('nv-wa-phone',n);e.target.value=waPretty(n);waRenderMsgs()}}
function waSync(){const fab=$('#waFab');if(!fab)return;const route=location.hash.slice(1),staffArea=['painel','gestao'].includes(route)&&user&&user.role!=='paciente';const show=waEnabled()&&!staffArea&&(!cloud.on||!!rxPhone(db.whatsapp?.number||''));fab.classList.toggle('hidden',!show);if(!show)$('#waPanel').classList.add('hidden');const n=rxPhone(db.whatsapp?.number||'');$('#waReal').innerHTML=n?`<a href="https://wa.me/${n}?text=${encodeURIComponent('Oi')}" target="_blank" rel="noopener noreferrer">Abrir o WhatsApp oficial ↗</a>`:'';if(!$('#waPanel').classList.contains('hidden'))waRenderMsgs()}
function waToggle(open){if(cloud.on){const n=rxPhone(db.whatsapp?.number||'');if(n)window.open('https://wa.me/'+n+'?text='+encodeURIComponent('Oi'),'_blank','noopener');return}const panel=$('#waPanel');open=open===undefined?panel.classList.contains('hidden'):open;panel.classList.toggle('hidden',!open);$('#waFab').setAttribute('aria-expanded',String(open));if(open){$('#waPhoneInput').value=waPretty(waPhone());waRenderMsgs();$('#waInput').focus()}}
function waRenderMsgs(){const box=$('#waMsgs');if(!box)return;const phone=rxPhone(waPhone()),chat=(db.waChats||[]).find(c=>c.phone===phone);box.innerHTML=`<div class="wa-sys">Simulação do WhatsApp com a agenda deste navegador. Use dados fictícios.</div>${chat?.messages?.length?'':'<div class="wa-sys">Envie <b>oi</b> para começar.</div>'}${waBubbles(chat,false)}${chat?.handoff?'<div class="wa-sys">Aguardando um atendente da equipe. Envie <b>menu</b> para voltar ao robô.</div>':''}`;box.scrollTop=box.scrollHeight}
async function waSend(text){text=String(text||'').trim();if(!text)return;const phone=rxPhone(waPhone());if(!phone){toast('Informe um WhatsApp válido.');return}try{const fresh=JSON.parse(localStorage.getItem(key));if(Array.isArray(fresh?.users))db=fresh}catch{}const before=JSON.stringify(db);await NVBot.reply(db,phone,text,{uid,now:()=>new Date(),hash,siteUrl:location.href.split('#')[0]});if(!persist()){db=JSON.parse(before);return}if(user)user=db.users.find(u=>u.id===user.id)||null;waRenderMsgs();if(['painel','gestao'].includes(location.hash.slice(1)))dashboard();else if(!location.hash.slice(1)||location.hash==='#inicio'){const y=scrollY;render();scrollTo(0,y)}}
function waStaff(){return admin()&&can('appointments')}
function renderWhatsApp(){if(!waStaff())return;const cfg=db.whatsapp||{},manage=['master','administrador'].includes(user.role),all=(db.waChats||[]).slice().sort((a,b)=>b.updated.localeCompare(a.updated)),chats=all.filter(c=>waChatFilter==='todas'||c.handoff);$('#dashContent').innerHTML=`<div class="stats"><div class="stat"><span>Conversas</span><strong>${all.length}</strong></div><div class="stat"><span>Aguardando atendente</span><strong>${all.filter(c=>c.handoff).length}</strong></div><div class="stat"><span>Agendadas pelo WhatsApp</span><strong>${db.bookings.filter(b=>b.origin==='whatsapp'&&b.status!=='cancelada').length}</strong></div></div><div class="panel"><div class="between"><div><div class="eyebrow">Atendimento automático</div><h3>Conversas do WhatsApp</h3></div><div class="row">${cloud.on?'':'<button class="btn small light" onclick="waToggleFromPanel()">Testar o robô</button>'}</div></div><p class="subtle" style="font-size:12px">O robô agenda, lista e cancela consultas, mostra nutricionistas e valores e envia o link da videochamada. Quando o paciente pede um atendente, a conversa aparece aqui.</p><div class="filters">${[['todas','Todas'],['handoff','Aguardando atendente']].map(([k,l])=>`<button class="chip ${waChatFilter===k?'active':''}" onclick="waChatFilter='${k}';renderWhatsApp()">${l}</button>`).join('')}</div>${chats.map(c=>{const p=db.users.find(u=>u.role==='paciente'&&rxPhone(u.phone||'')===c.phone),last=c.messages[c.messages.length-1];return `<div class="listitem"><div><span class="badge ${c.handoff?'booked':'free'}">${c.handoff?'Aguardando atendente':'Robô'}</span><h4 style="margin-top:8px">${esc(p?.name||'Sem cadastro')} · ${esc(waPretty(c.phone))}</h4><p>${last?esc(last.text.slice(0,90))+(last.text.length>90?'…':''):''}<br>${new Date(c.updated).toLocaleString('pt-BR')}</p></div><button class="btn small ${c.handoff?'':'light'}" onclick="waChatView('${c.id}')">Abrir conversa</button></div>`}).join('')||'<div class="empty">Nenhuma conversa neste filtro.</div>'}</div>${manage?`<div class="panel"><h3>Configuração do robô</h3><form id="waCfg"><label class="row"><input type="checkbox" name="enabled" style="width:auto" ${cfg.enabled!==false?'checked':''}> Atendimento automático ativo</label><label for="waNumber">Número oficial do WhatsApp da clínica (opcional)</label><input id="waNumber" name="number" type="tel" maxlength="30" value="${esc(cfg.number?waPretty(cfg.number):'')}" placeholder="+55 47 99999-9999"><label for="waWelcome">Mensagem de boas-vindas</label><textarea id="waWelcome" name="welcome" maxlength="500" placeholder="Olá! Eu sou o assistente virtual da NutriViva 🌿">${esc(cfg.welcome||'')}</textarea><label for="waOff">Resposta quando o robô estiver desativado</label><textarea id="waOff" name="offMessage" maxlength="500" placeholder="Recebemos sua mensagem. Nossa equipe vai responder por aqui assim que possível.">${esc(cfg.offMessage||'')}</textarea><div class="error" id="waErr" role="alert"></div><button class="btn wide">Salvar configuração</button></form></div>${cloud.on?'<div class="panel"><h3>Robô no WhatsApp oficial</h3><p class="note">O robô roda no servidor da pasta <b>whatsapp-bot</b>, ligado a este mesmo banco de dados: agendamentos feitos pelo WhatsApp aparecem aqui na hora, e o contrário também. O botão verde da página inicial abre o número oficial configurado acima.</p></div>':`<div class="panel"><h3>Conectar ao WhatsApp oficial</h3><p class="note">Este painel funciona como simulador, usando a agenda deste navegador. Para responder pacientes no WhatsApp de verdade, publique o servidor da pasta <b>whatsapp-bot</b> e conecte-o à API oficial do WhatsApp (Meta). O servidor usa o mesmo robô deste simulador. Exporte os dados abaixo para carregar a agenda inicial no servidor.<br>O arquivo inclui cadastros e e-mails: guarde-o com segurança e não o compartilhe.</p><button class="btn light small" onclick="waExport()">Exportar dados para o servidor</button></div>`}`:''}`;if(manage)$('#waCfg').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),raw=String(f.get('number')||'').trim(),number=raw?rxPhone(raw):'';if(raw&&!number){$('#waErr').textContent='Informe o número com código do país e DDD.';return}const previous=db.whatsapp;db.whatsapp={enabled:f.has('enabled'),number,welcome:String(f.get('welcome')||'').trim(),offMessage:String(f.get('offMessage')||'').trim()};if(!persist()){db.whatsapp=previous;return}renderWhatsApp();waSync();toast('Configuração do WhatsApp salva.')}}
function waToggleFromPanel(){location.hash='inicio';setTimeout(()=>waToggle(true),50)}
function waChatView(id){if(!waStaff())return;const c=(db.waChats||[]).find(c=>c.id===id);if(!c)return;const p=db.users.find(u=>u.role==='paciente'&&rxPhone(u.phone||'')===c.phone);modal('Conversa · '+waPretty(c.phone),`<p><b>${esc(p?.name||'Sem cadastro')}</b> <span class="badge ${c.handoff?'booked':'free'}">${c.handoff?'Com atendente':'Com o robô'}</span></p><div class="wa-transcript" id="waTranscript">${waBubbles(c,true)}</div><form id="waAgentForm"><label for="waAgentText">Responder como atendente</label><textarea id="waAgentText" maxlength="1000" required placeholder="Escreva a resposta para o paciente"></textarea><button class="btn wide">Enviar resposta</button></form><div class="row" style="margin-top:12px">${c.handoff?`<button class="btn light small" onclick="waHandoff('${c.id}',false)">Devolver ao robô</button>`:`<button class="btn light small" onclick="waHandoff('${c.id}',true)">Assumir a conversa</button>`}</div><p class="note">${cloud.on?'A resposta é enviada ao paciente no WhatsApp oficial pelo servidor do robô.':'No simulador, a resposta aparece na conversa deste navegador. Com o servidor conectado, as respostas da equipe precisam ser enviadas pelo servidor (veja o README do robô).'}</p>`);const tr=$('#waTranscript');tr.scrollTop=tr.scrollHeight;$('#waAgentForm').onsubmit=e=>{e.preventDefault();const text=$('#waAgentText').value.trim();if(!text)return;const now=new Date().toISOString(),previous=JSON.stringify(c);c.messages.push({from:'agent',text,at:now,by:user.name});c.handoff=true;c.updated=now;if(!persist()){Object.assign(c,JSON.parse(previous));return}if(cloud.on)cloud.fb.addDoc(cloud.fb.collection(cloud.fs,'waOutbox'),{phone:c.phone||c.id,text,by:user.name,at:now,sent:false}).catch(e=>toast('Resposta não enviada: '+cloudMsg(e)));waChatView(id);toast('Resposta enviada na conversa.')}}
function waHandoff(id,on){if(!waStaff())return;const c=(db.waChats||[]).find(c=>c.id===id);if(!c)return;c.handoff=on;if(!on)c.state={step:'menu'};c.updated=new Date().toISOString();persist();closeModal();renderWhatsApp();toast(on?'Você assumiu a conversa.':'Conversa devolvida ao robô.')}
function waExport(){if(!['master','administrador'].includes(user?.role))return;const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='db.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Arquivo db.json gerado. Coloque-o em whatsapp-bot/data/.')}

setupPwa();
window.addEventListener('hashchange',render);window.addEventListener('storage',e=>{if(cloud.on)return;if(user&&e.key==='nutriviva-theme:'+user.id){syncPanelTheme();return}if(e.key===key&&e.newValue){db=JSON.parse(e.newValue);user=db.users.find(u=>u.id===user?.id)||null;render()}});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});init();
</script></body></html>
